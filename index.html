<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Food Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --secondary: #34a853;
            --danger: #ea4335;
            --warning: #fbbc04;
            --info: #4285f4;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #202124;
            --text-secondary: #5f6368;
            --border: #dadce0;
            --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
            line-height: 1.6;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .login-box {
            background: var(--card-bg);
            padding: 40px; 
            border-radius: var(--radius);
            max-width: 450px; 
            margin: 100px auto;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeInUp 0.5s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-box h1 { 
            font-size: 24px; 
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .login-box .subtitle { 
            color: var(--text-secondary); 
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-field {
            width: 100%; 
            padding: 12px 16px; 
            margin: 10px 0;
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            font-size: 14px;
            transition: all 0.2s ease;
            background: white;
        }
        
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
            outline: none;
        }
        
        .btn {
            padding: 10px 20px; 
            border: none; 
            border-radius: var(--radius);
            cursor: pointer; 
            color: white; 
            margin: 4px; 
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn:hover {
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-primary { 
            background: var(--primary);
        }
        .btn-primary:hover { 
            background: var(--primary-dark);
        }
        
        .btn-danger { 
            background: var(--danger);
        }
        .btn-danger:hover { 
            background: #d33426;
        }
        
        .btn-warning { 
            background: var(--warning);
            color: #202124;
        }
        .btn-warning:hover { 
            background: #e5ab00;
        }
        
        .btn-info { 
            background: var(--info);
        }
        .btn-info:hover { 
            background: #3367d6;
        }
        
        .btn-success {
            background: var(--secondary);
        }
        .btn-success:hover {
            background: #2d9249;
        }
        
        .btn-small { 
            padding: 6px 12px; 
            font-size: 12px;
            text-transform: none;
        }
        
        .btn-logout {
            background: var(--danger);
            box-shadow: 0 2px 4px rgba(234, 67, 53, 0.3);
        }
        .btn-logout:hover {
            background: #d33426;
            box-shadow: 0 4px 8px rgba(234, 67, 53, 0.4);
        }
        
        .btn-new-month {
            background: #e8710a;
        }
        .btn-new-month:hover {
            background: #d05f00;
        }

        .header {
            background: var(--card-bg);
            padding: 20px 25px; 
            border-radius: var(--radius);
            margin-bottom: 20px; 
            display: flex;
            justify-content: space-between; 
            align-items: center;
            box-shadow: var(--shadow);
            animation: slideDown 0.4s ease-out;
            border-left: 4px solid var(--primary);
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 500;
            color: var(--text);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: var(--text);
            background: #f1f3f4;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .announcement-banner {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--warning);
            display: none;
            animation: slideDown 0.5s ease-out;
        }
        
        .announcement-banner h3 {
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .announcement-item {
            padding: 8px 0;
            border-bottom: 1px solid #f1f3f4;
            font-size: 14px;
            color: var(--text);
        }
        
        .announcement-item:last-child {
            border-bottom: none;
        }

        .summary-cards {
            display: grid; 
            grid-template-columns: repeat(3, 1fr);
            gap: 16px; 
            margin-bottom: 20px;
        }
        
        .card {
            background: var(--card-bg);
            padding: 20px; 
            border-radius: var(--radius);
            text-align: center; 
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
            animation: fadeIn 0.5s ease-out;
            border-top: 3px solid var(--primary);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }
        
        .card h3 { 
            color: var(--text-secondary); 
            font-size: 12px; 
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .card p { 
            font-size: 24px; 
            font-weight: 500;
            color: var(--text);
        }

        .admin-controls {
            background: var(--card-bg);
            padding: 15px 20px; 
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease-out;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 3px solid var(--primary);
        }

        .table-container {
            background: var(--card-bg);
            padding: 20px; 
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-x: auto;
            animation: fadeIn 0.6s ease-out;
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 14px;
        }
        
        th { 
            padding: 12px 16px; 
            text-align: left;
            background: #f8f9fa;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
        }
        
        td { 
            padding: 12px 16px; 
            border-bottom: 1px solid #f1f3f4;
            color: var(--text);
        }
        
        tbody tr {
            transition: background-color 0.2s ease;
        }
        
        tbody tr:hover { 
            background: #f8f9fa;
        }

        .badge {
            padding: 4px 10px; 
            border-radius: 4px;
            font-size: 11px; 
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .badge-success { 
            background: #e6f4ea;
            color: #1e7e34;
        }
        .badge-danger { 
            background: #fce8e6;
            color: #d93025;
        }

        .action-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .login-action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 25px 0;
        }
        
        .login-action-buttons button {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-user { 
            background: var(--primary);
            color: white;
            border: none;
        }
        .btn-admin { 
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-user:hover { 
            background: var(--primary-dark);
            box-shadow: var(--shadow);
        }
        .btn-admin:hover { 
            background: #f8f9fa;
            box-shadow: var(--shadow);
        }
        
        .admin-password-section {
            display: none;
            margin-top: 20px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease-out;
        }
        
        .admin-password-section h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--text);
        }
        
        .admin-password-section button {
            width: 100%;
            background: var(--danger);
            color: white;
            border: none;
            padding: 12px;
            border-radius: var(--radius);
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .admin-password-section button:hover {
            background: #d33426;
            box-shadow: var(--shadow);
        }

        .buying-option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: left;
            padding-left: 20px;
        }
        
        .buying-option-btn:hover {
            background: #f8f9fa;
            border-color: var(--primary);
            padding-left: 25px;
        }

        @media (max-width: 768px) {
            .summary-cards { grid-template-columns: repeat(2, 1fr); }
            .header { flex-direction: column; gap: 15px; }
            .admin-controls { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div id="loginPage" class="container">
        <div class="login-box">
            <h1>Mess Food Management System</h1>
            <p class="subtitle">Mess Administration Portal</p>
            
            <div class="login-action-buttons">
                <button class="btn-user" onclick="loginAsUser()">👤 Enter as User</button>
                <button class="btn-admin" onclick="toggleAdminPassword()">🔐 Admin Login</button>
            </div>

            <div id="adminPasswordSection" class="admin-password-section">
                <h3>Administrator Authentication</h3>
                <input type="password" id="adminPasswordInput" placeholder="Enter admin password" class="input-field">
                <button onclick="loginAsAdmin()">Login as Admin</button>
            </div>
        </div>
    </div>

    <div id="dashboard" class="container" style="display:none;">
        <div class="header">
            <h1>📋 Mess Food Management</h1>
            <div class="user-info">
                <span class="user-badge" id="loggedUser"></span>
                <button onclick="logout()" class="btn btn-logout">Logout</button>
            </div>
        </div>

        <div id="announcementBanner" class="announcement-banner">
            <h3>📢 Important Updates</h3>
            <div id="announcementContent"></div>
        </div>

        <div class="summary-cards">
            <div class="card">
                <h3>Total Members</h3>
                <p id="totalMembers">0</p>
            </div>
            <div class="card">
                <h3>Total Paid</h3>
                <p id="totalPaid">৳0</p>
            </div>
            <div class="card">
                <h3>Total Meals</h3>
                <p id="totalMeals">0</p>
            </div>
        </div>

        <div id="adminControls" class="admin-controls" style="display:none;">
            <button onclick="calculateAll()" class="btn btn-primary">💰 Calculate All</button>
            <button onclick="showBuyingOptions()" class="btn btn-info">🛒 Buying</button>
            <button onclick="startNewMonth()" class="btn btn-new-month">🔄 Start New</button>
            <button onclick="addMember()" class="btn btn-success">➕ Add Member</button>
            <button onclick="refreshData()" class="btn btn-warning">↻ Refresh</button>
            <button onclick="manageUpdates()" class="btn btn-primary">📢 Important Updates</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Target</th>
                        <th>Total Paid</th>
                        <th>Status</th>
                        <th>Meals</th>
                        <th>Refund</th>
                        <th id="actionsHeader" style="display:none;">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // ⚠️ IMPORTANT: Replace with your deployed Web App URL
        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbzUDU85Mv7T_XQpQOHABTIw2D5vb0y3TUSBj9Bk7DlFG50QremTkJU_ywjA00c1J8FM/exec";
        const MONTHLY_TARGET = 2300;
        const MINIMUM_MEALS = 45;
        const MAX_UPDATES = 3;
        let currentUser = null;
        let allMembers = [];
        let announcements = [];

        async function makeRequest(action, params = {}) {
            try {
                const queryString = Object.keys(params)
                    .map(key => `${key}=${encodeURIComponent(params[key])}`)
                    .join('&');
                const url = `${GOOGLE_SHEETS_URL}?action=${action}${queryString ? '&' + queryString : ''}`;
                
                console.log('Request URL:', url);
                
                const response = await fetch(url);
                const text = await response.text();
                console.log('Response:', text);
                
                return JSON.parse(text);
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'Could not connect to Google Sheets. Error: ' + error.message, 'error');
                return { success: false, message: error.message };
            }
        }

        function loginAsUser() {
            currentUser = { name: "User", role: "user" };
            enterDashboard();
        }

        function toggleAdminPassword() {
            const adminSection = document.getElementById('adminPasswordSection');
            if (adminSection.style.display === 'block') {
                adminSection.style.display = 'none';
            } else {
                adminSection.style.display = 'block';
                document.getElementById('adminPasswordInput').focus();
            }
        }

        function loginAsAdmin() {
            const password = document.getElementById('adminPasswordInput').value;
            
            if (!password) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Please enter admin password' });
                return;
            }
            
            if (password === "66!") {
                currentUser = { name: "Admin", role: "admin" };
                document.getElementById('adminPasswordInput').value = '';
                document.getElementById('adminPasswordSection').style.display = 'none';
                enterDashboard();
                Swal.fire({
                    icon: 'success',
                    title: 'Welcome Admin!',
                    text: 'You have successfully logged in',
                    timer: 2000,
                    showConfirmButton: false
                });
            } else {
                Swal.fire({ icon: 'error', title: 'Access Denied', text: 'Wrong admin password!' });
                document.getElementById('adminPasswordInput').value = '';
            }
        }

        function enterDashboard() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('loggedUser').textContent = `👤 ${currentUser.name}`;
            
            if (currentUser.role === 'admin') {
                document.getElementById('adminControls').style.display = 'flex';
                document.getElementById('actionsHeader').style.display = 'table-cell';
            } else {
                document.getElementById('adminControls').style.display = 'none';
                document.getElementById('actionsHeader').style.display = 'none';
            }
            
            loadData();
            loadAnnouncements();
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('adminPasswordSection').style.display = 'none';
            document.getElementById('adminPasswordInput').value = '';
        }

        async function loadData() {
            try {
                const data = await makeRequest('getAllData');
                console.log('Loaded data:', data);
                
                if (data && data.success) {
                    allMembers = data.members || [];
                    renderTable();
                    updateSummary();
                } else {
                    console.error('Failed to load data:', data);
                }
            } catch (error) {
                console.error('Error in loadData:', error);
            }
        }

        async function loadAnnouncements() {
            try {
                const data = await makeRequest('getUpdates');
                console.log('Loaded announcements:', data);
                
                if (data && data.success) {
                    announcements = data.updates || [];
                    renderAnnouncements();
                }
            } catch (error) {
                console.error('Error in loadAnnouncements:', error);
            }
        }

        function renderAnnouncements() {
            const banner = document.getElementById('announcementBanner');
            const content = document.getElementById('announcementContent');
            
            if (announcements.length === 0) {
                banner.style.display = 'none';
                content.innerHTML = '';
                return;
            }
            
            banner.style.display = 'block';
            content.innerHTML = announcements.map(update => 
                `<div class="announcement-item">• ${update}</div>`
            ).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (allMembers.length === 0) {
                const colspan = currentUser.role === 'admin' ? 8 : 7;
                tbody.innerHTML = `<tr><td colspan="${colspan}" style="text-align:center; color: #5f6368;">No data available</td></tr>`;
                return;
            }
            
            allMembers.forEach((member, index) => {
                const isComplete = member.totalPaid >= MONTHLY_TARGET;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${member.memberName}</strong></td>
                    <td>৳${MONTHLY_TARGET}</td>
                    <td>৳${member.totalPaid}</td>
                    <td>${isComplete ? '<span class="badge badge-success">Complete</span>' : '<span class="badge badge-danger">Incomplete</span>'}</td>
                    <td>${member.totalMeals}</td>
                    <td><strong style="color:${member.refund >= 0 ? '#1e7e34' : '#d93025'};">৳${member.refund.toFixed(2)}</strong></td>
                    ${currentUser.role === 'admin' ? `
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-primary btn-small" onclick="editPayment('${member.memberName}')">💰</button>
                                <button class="btn btn-warning btn-small" onclick="editMeals('${member.memberName}')">🍽️</button>
                                <button class="btn btn-danger btn-small" onclick="deleteMember('${member.memberName}')">🗑️</button>
                            </div>
                        </td>
                    ` : ''}
                `;
                tbody.appendChild(row);
            });
        }

        function updateSummary() {
            const totalPaid = allMembers.reduce((s, m) => s + m.totalPaid, 0);
            const totalMeals = allMembers.reduce((s, m) => s + m.totalMeals, 0);
            document.getElementById('totalMembers').textContent = allMembers.length;
            document.getElementById('totalPaid').textContent = `৳${totalPaid}`;
            document.getElementById('totalMeals').textContent = totalMeals;
        }

        async function manageUpdates() {
            const updateOptions = announcements.map((update, index) => 
                `<button class="buying-option-btn" onclick="editUpdate(${index})">✏️ Edit: ${update.substring(0, 30)}${update.length > 30 ? '...' : ''}</button>
                 <button class="buying-option-btn" style="background:#fce8e6;color:#d93025;border-color:#ea4335;" onclick="deleteUpdate(${index})">🗑️ Delete: ${update.substring(0, 30)}${update.length > 30 ? '...' : ''}</button>`
            ).join('');
            
            const html = `
                <div style="margin-bottom: 15px;">
                    <h4 style="margin-bottom: 10px;">Current Updates (${announcements.length}/${MAX_UPDATES})</h4>
                    ${updateOptions || '<p style="color:#5f6368;">No updates yet</p>'}
                </div>
                ${announcements.length < MAX_UPDATES ? 
                    `<button class="buying-option-btn" style="background:#e6f4ea;color:#1e7e34;border-color:#34a853;" onclick="addUpdate()">➕ Add New Update</button>` : 
                    '<p style="color:#d93025;font-weight:500;">Maximum updates reached. Delete one to add new.</p>'
                }
            `;
            
            Swal.fire({
                title: 'Manage Important Updates',
                html: html,
                showCancelButton: true,
                showConfirmButton: false,
                cancelButtonText: 'Close'
            });
        }

        async function addUpdate() {
            if (announcements.length >= MAX_UPDATES) {
                Swal.fire('Error', 'Maximum 3 updates allowed. Please delete one first.', 'error');
                return;
            }
            
            const { value: updateText } = await Swal.fire({
                title: 'Add New Update',
                input: 'textarea',
                inputLabel: 'Update text',
                inputPlaceholder: 'Enter your important update here...',
                showCancelButton: true,
                confirmButtonText: 'Add Update',
                cancelButtonText: 'Cancel',
                inputValidator: (value) => {
                    if (!value || value.trim() === '') {
                        return 'Please enter update text';
                    }
                }
            });
            
            if (updateText && updateText.trim()) {
                const result = await makeRequest('addUpdate', { update: updateText.trim() });
                if (result.success) {
                    Swal.fire('Success', 'Update added successfully', 'success');
                    await loadAnnouncements();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function editUpdate(index) {
            const { value: updateText } = await Swal.fire({
                title: 'Edit Update',
                input: 'textarea',
                inputLabel: 'Update text',
                inputValue: announcements[index],
                showCancelButton: true,
                confirmButtonText: 'Save Changes',
                cancelButtonText: 'Cancel',
                inputValidator: (value) => {
                    if (!value || value.trim() === '') {
                        return 'Please enter update text';
                    }
                }
            });
            
            if (updateText && updateText.trim()) {
                const result = await makeRequest('editUpdate', { index: index, update: updateText.trim() });
                if (result.success) {
                    Swal.fire('Success', 'Update edited successfully', 'success');
                    await loadAnnouncements();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function deleteUpdate(index) {
            const confirm = await Swal.fire({
                title: 'Delete Update?',
                text: 'Are you sure you want to delete this update?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, delete',
                cancelButtonText: 'Cancel'
            });
            
            if (confirm.isConfirmed) {
                const result = await makeRequest('deleteUpdate', { index: index });
                if (result.success) {
                    Swal.fire('Deleted!', 'Update deleted successfully', 'success');
                    await loadAnnouncements();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function editPayment(memberName) {
            const member = allMembers.find(m => m.memberName === memberName);
            const { value: amount } = await Swal.fire({
                title: `Add payment for ${memberName}`,
                text: `Current total: ৳${member ? member.totalPaid : 0}`,
                input: 'number',
                inputLabel: 'Amount to add (৳)',
                inputPlaceholder: 'Enter amount to add',
                showCancelButton: true,
                confirmButtonText: 'Add Payment',
                cancelButtonText: 'Cancel',
                inputValidator: (value) => {
                    if (!value || value <= 0) return 'Please enter a valid amount';
                }
            });
            
            if (amount && amount > 0) {
                const result = await makeRequest('updatePayment', { memberName, amount });
                if (result.success) {
                    Swal.fire('Success', result.message, 'success');
                    await loadData();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function editMeals(memberName) {
            const member = allMembers.find(m => m.memberName === memberName);
            const { value: meals } = await Swal.fire({
                title: `Add meals for ${memberName}`,
                text: `Current total meals: ${member ? member.totalMeals : 0}`,
                input: 'number',
                inputLabel: 'Number of meals to add (can be decimal like 0.5)',
                inputPlaceholder: 'Enter meals to add',
                showCancelButton: true,
                confirmButtonText: 'Add Meals',
                cancelButtonText: 'Cancel',
                inputValidator: (value) => {
                    if (!value || parseFloat(value) < 0) return 'Please enter a valid number (0 or greater)';
                }
            });
            
            if (meals !== undefined && meals !== null && parseFloat(meals) >= 0) {
                const result = await makeRequest('updateMeals', { memberName, meals: parseFloat(meals) });
                if (result.success) {
                    Swal.fire({ icon: 'success', title: 'Success', text: result.message });
                    await loadData();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function deleteMember(memberName) {
            const confirm = await Swal.fire({
                title: 'Delete member?',
                text: `Are you sure you want to delete ${memberName}?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, delete',
                cancelButtonText: 'Cancel'
            });
            
            if (confirm.isConfirmed) {
                const result = await makeRequest('deleteMember', { memberName });
                if (result.success) {
                    Swal.fire('Deleted!', result.message, 'success');
                    await loadData();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        function showBuyingOptions() {
            Swal.fire({
                title: 'Select Buying Option',
                html: `
                    <button class="buying-option-btn" onclick="addSpecificBuying(1)">1st Buying Cost</button>
                    <button class="buying-option-btn" onclick="addSpecificBuying(2)">2nd Buying Cost</button>
                    <button class="buying-option-btn" onclick="addSpecificBuying(3)">3rd Buying Cost</button>
                    <button class="buying-option-btn" onclick="addSpecificBuying(4)">4th Buying Cost</button>
                    <button class="buying-option-btn" onclick="addSpecificBuying(5)">5th Buying Cost</button>
                    <button class="buying-option-btn" onclick="addSpecificBuying(6)">6th Buying Cost</button>
                    <button class="buying-option-btn" style="background:#e6f4ea;color:#1e7e34;border-color:#34a853;" onclick="addAllBuying()">Add All Buying Costs</button>
                `,
                showCancelButton: true,
                showConfirmButton: false,
                cancelButtonText: 'Close'
            });
        }

        async function addSpecificBuying(buyingNumber) {
            const buyingLabels = ['', '1st', '2nd', '3rd', '4th', '5th', '6th'];
            const { value: cost } = await Swal.fire({
                title: `${buyingLabels[buyingNumber]} Buying Cost`,
                input: 'number',
                inputLabel: 'Enter cost (৳)',
                inputPlaceholder: `${buyingLabels[buyingNumber]} Buying cost`,
                showCancelButton: true,
                confirmButtonText: 'Save',
                cancelButtonText: 'Cancel',
                inputValidator: (value) => {
                    if (!value || value <= 0) {
                        return 'Please enter a valid amount greater than 0';
                    }
                }
            });
            
            if (cost && cost > 0) {
                const buyingCosts = [0, 0, 0, 0, 0, 0];
                buyingCosts[buyingNumber - 1] = parseFloat(cost);
                
                const result = await makeRequest('addBuying', { buyingCosts: JSON.stringify(buyingCosts) });
                if (result.success) {
                    Swal.fire('Success', `${buyingLabels[buyingNumber]} buying cost saved: ৳${cost}`, 'success');
                    await loadData();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function addAllBuying() {
            const { value: formValues } = await Swal.fire({
                title: 'Add All Buying Costs',
                html: `
                    <input id="buying-1" class="swal2-input" placeholder="1st Buying cost" type="number">
                    <input id="buying-2" class="swal2-input" placeholder="2nd Buying cost" type="number">
                    <input id="buying-3" class="swal2-input" placeholder="3rd Buying cost" type="number">
                    <input id="buying-4" class="swal2-input" placeholder="4th Buying cost" type="number">
                    <input id="buying-5" class="swal2-input" placeholder="5th Buying cost" type="number">
                    <input id="buying-6" class="swal2-input" placeholder="6th Buying cost" type="number">
                `,
                showCancelButton: true,
                confirmButtonText: 'Save All',
                cancelButtonText: 'Cancel',
                preConfirm: () => {
                    const buyingCosts = [];
                    for (let i = 1; i <= 6; i++) {
                        const cost = document.getElementById(`buying-${i}`).value;
                        buyingCosts.push(cost ? parseFloat(cost) : 0);
                    }
                    if (buyingCosts.every(cost => cost === 0)) {
                        Swal.showValidationMessage('Please enter at least one cost');
                        return false;
                    }
                    return { buyingCosts };
                }
            });
            
            if (formValues) {
                const result = await makeRequest('addBuying', { buyingCosts: JSON.stringify(formValues.buyingCosts) });
                if (result.success) {
                    Swal.fire('Success', result.message, 'success');
                    await loadData();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function calculateAll() {
            const confirm = await Swal.fire({
                title: 'Calculate All?',
                text: 'This will calculate the meal rate and update all refunds',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, Calculate',
                cancelButtonText: 'Cancel'
            });
            
            if (confirm.isConfirmed) {
                const result = await makeRequest('calculateAll');
                console.log('Calculate result:', result);
                
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Calculation Complete!',
                        html: `
                            <p>Total Buying Cost: ৳${result.totalBuyingCost}</p>
                            <p>Total Meals: ${result.totalMeals}</p>
                            <p>Meal Rate: ৳${result.mealRate} per meal</p>
                        `,
                        confirmButtonText: 'OK'
                    }).then(() => {
                        loadData();
                    });
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function startNewMonth() {
            const confirm = await Swal.fire({
                title: 'Start New Month?',
                text: 'This will reset all payment, meals, and buying data for the new month. Member names will remain. This action cannot be undone!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, Start New Month',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6'
            });
            
            if (confirm.isConfirmed) {
                const result = await makeRequest('startNewMonth');
                console.log('Start new month result:', result);
                
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'New Month Started!',
                        text: result.message,
                        confirmButtonText: 'OK'
                    }).then(() => {
                        loadData();
                    });
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function addMember() {
            const { value: name } = await Swal.fire({
                title: 'Add new member',
                input: 'text',
                inputLabel: 'Member name',
                inputPlaceholder: 'Enter member name',
                showCancelButton: true,
                confirmButtonText: 'Add Member',
                cancelButtonText: 'Cancel',
                inputValidator: (value) => {
                    if (!value || value.trim() === '') return 'Please enter a member name';
                }
            });
            
            if (name && name.trim()) {
                const result = await makeRequest('addMember', { memberName: name.trim() });
                if (result.success) {
                    Swal.fire('Success', result.message, 'success');
                    await loadData();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function refreshData() {
            await loadData();
            await loadAnnouncements();
            Swal.fire('Refreshed', 'Data updated successfully', 'success');
        }
    </script>
</body>
  </html>
