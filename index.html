<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Food Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --secondary: #34a853;
            --danger: #ea4335;
            --warning: #fbbc04;
            --info: #4285f4;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #202124;
            --text-secondary: #5f6368;
            --border: #dadce0;
            --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* ============================================================
           HACKER SPLASH SCREEN — POLISHED
           ============================================================ */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #08131c 0%, #04090f 55%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: 'Courier New', 'Fira Code', 'Monaco', 'Menlo', monospace;
            transition: opacity 1s ease, filter 1s ease;
            padding: 24px;
            color: #a0ffb0;
            overflow: hidden;
        }

        /* Soft ambient orbs for depth */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 9s ease-in-out infinite;
        }
        .orb-1 {
            width: 340px; height: 340px;
            background: #00ffaa;
            top: -90px; left: -60px;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: #00c2ff;
            bottom: -90px; right: -60px;
            animation-delay: -3s;
        }
        .orb-3 {
            width: 260px; height: 260px;
            background: #7c4dff;
            top: 40%; left: 55%;
            opacity: 0.28;
            animation-delay: -6s;
        }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(30px, -20px) scale(1.12); }
        }

        /* Matrix rain canvas */
        #matrixCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.16;
        }

        /* Grid overlay */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 170, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 170, 0.05) 1px, transparent 1px);
            background-size: 44px 44px;
            z-index: 2;
            animation: gridShift 14s linear infinite;
            pointer-events: none;
            mask-image: radial-gradient(circle at center, #000 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at center, #000 20%, transparent 75%);
        }
        @keyframes gridShift {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(44px, 44px); }
        }

        /* Sweeping scanline */
        .scanline {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffaa, #00ffcc, #00ffaa, transparent);
            box-shadow: 0 0 18px #00ffaa, 0 0 34px #00cc77;
            animation: scan 4s linear infinite;
            z-index: 3;
            opacity: 0.55;
        }
        @keyframes scan {
            0%   { top: -5%; }
            100% { top: 105%; }
        }

        /* Subtle CRT flicker */
        #splashScreen::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 255, 170, 0.015);
            pointer-events: none;
            z-index: 4;
            animation: flicker 0.18s infinite;
        }
        @keyframes flicker {
            0%, 100% { opacity: 0.03; }
            50%      { opacity: 0.07; }
        }

        /* Vignette */
        #splashScreen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Central panel */
        .splash-inner {
            position: relative;
            z-index: 5;
            text-align: center;
            max-width: 780px;
            width: 100%;
            padding: 52px 42px;
            border: 1px solid rgba(0, 255, 170, 0.28);
            border-radius: 18px;
            background: rgba(4, 14, 22, 0.72);
            box-shadow:
                0 0 50px rgba(0, 255, 140, 0.22),
                0 0 110px rgba(0, 255, 140, 0.06),
                inset 0 0 45px rgba(0, 255, 150, 0.05);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: panelIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.15);
        }

        @keyframes panelIn {
            0%   { opacity: 0; transform: scale(0.86) translateY(24px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0);     filter: blur(0); }
        }

        /* Terminal bar (chrome) */
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            padding-bottom: 16px;
            border-bottom: 1px dashed rgba(0, 255, 170, 0.22);
        }
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
            transition: transform 0.25s ease;
        }
        .terminal-dot:hover { transform: scale(1.2); }
        .dot-red    { background: #ff5f56; color: #ff5f56; }
        .dot-yellow { background: #ffbd2e; color: #ffbd2e; }
        .dot-green  { background: #27c93f; color: #27c93f; }
        .terminal-title {
            margin-left: auto;
            font-size: 0.72rem;
            color: rgba(160, 255, 176, 0.55);
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        /* Welcome typed text */
        .typed-line {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 5px;
            color: #d4ffe1;
            text-shadow:
                0 0 12px #00ffaa,
                0 0 28px #00cc77,
                0 0 55px #006633;
            min-height: 4.6rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            margin-bottom: 0.2rem;
            animation: glowPulse 2.6s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 12px #00ffaa, 0 0 28px #00cc77, 0 0 55px #006633; }
            50%      { text-shadow: 0 0 20px #00ffcc, 0 0 45px #00ffaa, 0 0 85px #009955; }
        }

        /* Blinking cursor */
        .cursor {
            display: inline-block;
            width: 16px;
            height: 2.7rem;
            background: #00ffb3;
            margin-left: 10px;
            box-shadow: 0 0 16px #00ffaa, 0 0 32px #00aa66;
            animation: blink 0.85s steps(1) infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Animated divider */
        .glow-line {
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffaa, #00ffcc, #00ffaa, transparent);
            margin: 20px auto 18px;
            box-shadow: 0 0 24px #00ffaa, 0 0 44px #00aa66;
            animation: expand 1.5s ease-out 0.3s forwards;
            border-radius: 2px;
        }
        @keyframes expand {
            from { width: 0%; opacity: 0; }
            to   { width: 100%; opacity: 1; }
        }

        /* Credit line */
        .typed-credit {
            font-size: 1.4rem;
            font-weight: 400;
            color: #b2e0c0;
            text-shadow: 0 0 10px #00cc88, 0 0 20px #006633;
            letter-spacing: 1.6px;
            min-height: 2.2rem;
            margin-top: 4px;
            font-family: 'Courier New', monospace;
        }

        .heart {
            color: #ff4d6d;
            text-shadow: 0 0 12px #ff0033, 0 0 28px #aa0022, 0 0 42px #ff0033;
            font-size: 1.6rem;
            display: inline-block;
            animation: heartbeat 1.15s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25%      { transform: scale(1.38); }
            45%      { transform: scale(1); }
            65%      { transform: scale(1.28); }
        }

        /* Progress shimmer below credit */
        .shimmer {
            margin-top: 26px;
            height: 3px;
            width: 100%;
            border-radius: 3px;
            overflow: hidden;
            background: rgba(0, 255, 170, 0.08);
            position: relative;
        }
        .shimmer::before {
            content: '';
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #00ffaa, #00ffcc, #00ffaa, transparent);
            box-shadow: 0 0 18px #00ffaa;
            animation: shimmerMove 1.6s ease-in-out infinite;
        }
        @keyframes shimmerMove {
            0%   { left: -40%; }
            100% { left: 100%; }
        }

        .fade-out-splash {
            opacity: 0 !important;
            filter: blur(14px) brightness(1.9) !important;
            transition: opacity 1s ease, filter 1s ease !important;
            pointer-events: none;
        }

        /* ============================================================
           ORIGINAL UI (unchanged)
           ============================================================ */
        .login-box {
            background: var(--card-bg);
            padding: 40px; 
            border-radius: var(--radius);
            max-width: 450px; 
            margin: 100px auto;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeInUp 0.5s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        
        .login-box h1 { 
            font-size: 24px; 
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .login-box .subtitle { 
            color: var(--text-secondary); 
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-field {
            width: 100%; 
            padding: 12px 16px; 
            margin: 10px 0;
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            font-size: 14px;
            transition: all 0.2s ease;
            background: white;
        }
        
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
            outline: none;
        }
        
        .btn {
            padding: 10px 20px; 
            border: none; 
            border-radius: var(--radius);
            cursor: pointer; 
            color: white; 
            margin: 4px; 
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #d33426; }
        .btn-warning { background: var(--warning); color: #202124; }
        .btn-warning:hover { background: #e5ab00; }
        .btn-info { background: var(--info); }
        .btn-info:hover { background: #3367d6; }
        .btn-success { background: var(--secondary); }
        .btn-success:hover { background: #2d9249; }
        .btn-small { padding: 6px 12px; font-size: 12px; text-transform: none; }
        .btn-logout {
            background: var(--danger);
            box-shadow: 0 2px 4px rgba(234, 67, 53, 0.3);
        }
        .btn-logout:hover {
            background: #d33426;
            box-shadow: 0 4px 8px rgba(234, 67, 53, 0.4);
        }
        .btn-new-month { background: #e8710a; }
        .btn-new-month:hover { background: #d05f00; }

        .header {
            background: var(--card-bg);
            padding: 20px 25px; 
            border-radius: var(--radius);
            margin-bottom: 20px; 
            display: flex;
            justify-content: space-between; 
            align-items: center;
            box-shadow: var(--shadow);
            animation: slideDown 0.4s ease-out;
            border-left: 4px solid var(--primary);
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        
        .header h1 { font-size: 20px; font-weight: 500; color: var(--text); }
        
        .user-info { display: flex; align-items: center; gap: 15px; }
        
        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: var(--text);
            background: #f1f3f4;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .announcement-banner {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--warning);
            display: none;
            animation: slideDown 0.5s ease-out;
        }
        
        .announcement-banner h3 {
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .announcement-item {
            padding: 8px 0;
            border-bottom: 1px solid #f1f3f4;
            font-size: 14px;
            color: var(--text);
        }
        .announcement-item:last-child { border-bottom: none; }

        .summary-cards {
            display: grid; 
            grid-template-columns: repeat(3, 1fr);
            gap: 16px; 
            margin-bottom: 20px;
        }
        
        .card {
            background: var(--card-bg);
            padding: 20px; 
            border-radius: var(--radius);
            text-align: center; 
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
            animation: fadeIn 0.5s ease-out;
            border-top: 3px solid var(--primary);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1); }
        }
        
        .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
        
        .card h3 { 
            color: var(--text-secondary); 
            font-size: 12px; 
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .card p { font-size: 24px; font-weight: 500; color: var(--text); }

        .admin-controls {
            background: var(--card-bg);
            padding: 15px 20px; 
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease-out;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 3px solid var(--primary);
        }

        .table-container {
            background: var(--card-bg);
            padding: 20px; 
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-x: auto;
            animation: fadeIn 0.6s ease-out;
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        
        th { 
            padding: 12px 16px; 
            text-align: left;
            background: #f8f9fa;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
        }
        
        td { 
            padding: 12px 16px; 
            border-bottom: 1px solid #f1f3f4;
            color: var(--text);
        }
        
        tbody tr { transition: background-color 0.2s ease; }
        tbody tr:hover { background: #f8f9fa; }

        .badge {
            padding: 4px 10px; 
            border-radius: 4px;
            font-size: 11px; 
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .badge-success { background: #e6f4ea; color: #1e7e34; }
        .badge-danger  { background: #fce8e6; color: #d93025; }

        .action-buttons { display: flex; gap: 4px; flex-wrap: wrap; }

        .login-action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 25px 0;
        }
        
        .login-action-buttons button {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-user { background: var(--primary); color: white; border: none; }
        .btn-admin { background: white; color: var(--text); border: 1px solid var(--border); }
        .btn-user:hover { background: var(--primary-dark); box-shadow: var(--shadow); }
        .btn-admin:hover { background: #f8f9fa; box-shadow: var(--shadow); }
        
        .admin-password-section {
            display: none;
            margin-top: 20px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease-out;
        }
        
        .admin-password-section h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--text);
        }
        
        .admin-password-section button {
            width: 100%;
            background: var(--danger);
            color: white;
            border: none;
            padding: 12px;
            border-radius: var(--radius);
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .admin-password-section button:hover {
            background: #d33426;
            box-shadow: var(--shadow);
        }

        .buying-option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: left;
            padding-left: 20px;
        }
        
        .buying-option-btn:hover {
            background: #f8f9fa;
            border-color: var(--primary);
            padding-left: 25px;
        }

        @media (max-width: 768px) {
            .summary-cards { grid-template-columns: repeat(2, 1fr); }
            .header { flex-direction: column; gap: 15px; }
            .admin-controls { flex-direction: column; }
            .typed-line { font-size: 1.9rem; min-height: 3.4rem; letter-spacing: 2px; }
            .typed-credit { font-size: 1rem; letter-spacing: 1px; }
            .splash-inner { padding: 34px 20px; }
            .terminal-title { font-size: 0.6rem; letter-spacing: 1.6px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
         HACKER SPLASH SCREEN
         ============================================================ -->
    <div id="splashScreen">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <canvas id="matrixCanvas"></canvas>
        <div class="grid-overlay"></div>
        <div class="scanline"></div>

        <div class="splash-inner">
            <div class="terminal-bar">
                <span class="terminal-dot dot-red"></span>
                <span class="terminal-dot dot-yellow"></span>
                <span class="terminal-dot dot-green"></span>
                <span class="terminal-title">root@mess-system</span>
            </div>

            <div class="typed-line" id="typedWelcome"></div>
            <div class="glow-line"></div>
            <div class="typed-credit" id="typedCredit"></div>

            <div class="shimmer"></div>
        </div>
    </div>

    <!-- ============================================================
         LOGIN PAGE
         ============================================================ -->
    <div id="loginPage" class="container" style="display: none;">
        <div class="login-box">
            <h1>Mess Food Management System</h1>
            <p class="subtitle">Mess Administration Portal</p>
            
            <div class="login-action-buttons">
                <button class="btn-user" onclick="loginAsUser()">👤 Enter as User</button>
                <button class="btn-admin" onclick="toggleAdminPassword()">🔐 Admin Login</button>
            </div>

            <div id="adminPasswordSection" class="admin-password-section">
                <h3>Administrator Authentication</h3>
                <input type="password" id="adminPasswordInput" placeholder="Enter admin password" class="input-field">
                <button onclick="loginAsAdmin()">Login as Admin</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         DASHBOARD
         ============================================================ -->
    <div id="dashboard" class="container" style="display:none;">
        <div class="header">
            <h1>📋 Mess Food Management</h1>
            <div class="user-info">
                <span class="user-badge" id="loggedUser"></span>
                <button onclick="logout()" class="btn btn-logout">Logout</button>
            </div>
        </div>

        <div id="announcementBanner" class="announcement-banner">
            <h3>📢 Important Updates</h3>
            <div id="announcementContent"></div>
        </div>

        <div class="summary-cards">
            <div class="card">
                <h3>Total Members</h3>
                <p id="totalMembers">0</p>
            </div>
            <div class="card">
                <h3>Total Paid</h3>
                <p id="totalPaid">৳0</p>
            </div>
            <div class="card">
                <h3>Total Meals</h3>
                <p id="totalMeals">0</p>
            </div>
        </div>

        <div id="adminControls" class="admin-controls" style="display:none;">
            <button onclick="calculateAll()" class="btn btn-primary">💰 Calculate All</button>
            <button onclick="showBuyingOptions()" class="btn btn-info">🛒 Buying</button>
            <button onclick="startNewMonth()" class="btn btn-new-month">🔄 Start New</button>
            <button onclick="addMember()" class="btn btn-success">➕ Add Member</button>
            <button onclick="refreshData()" class="btn btn-warning">↻ Refresh</button>
            <button onclick="manageUpdates()" class="btn btn-primary">📢 Important Updates</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Target</th>
                        <th>Total Paid</th>
                        <th>Status</th>
                        <th>Meals</th>

    <script>
        // ⚠️ IMPORTANT: Replace with your deployed Web App URL
        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbzUDU85Mv7T_XQpQOHABTIw2D5vb0y3TUSBj9Bk7DlFG50QremTkJU_ywjA00c1J8FM/exec";
        const MONTHLY_TARGET = 2500;
        const MINIMUM_MEALS = 45;
        const MAX_UPDATES = 3;
        let currentUser = null;
        let allMembers = [];
        let announcements = [];

        // ============================================================
        // SPLASH SCREEN: MATRIX + TYPING + PRO TYPING SOUND
        // ============================================================
        (function() {
            // ---------- 1. MATRIX CANVAS ----------
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            let columns, drops;
            const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF<>[]{}#$%&*'.split('');

            function resizeCanvas() {
                canvas.width  = window.innerWidth;
                canvas.height = window.innerHeight;
                const fontSize = 16;
                columns = Math.floor(canvas.width / fontSize);
                drops = new Array(columns).fill(1);
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            function drawMatrix() {
                ctx.fillStyle = 'rgba(4, 10, 16, 0.09)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ff9c';
                ctx.font = '15px "Courier New", monospace';
                for (let i = 0; i < drops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    const x = i * 16;
                    const y = drops[i] * 16;
                    ctx.fillText(text, x, y);
                    if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            const matrixInterval = setInterval(drawMatrix, 55);

            // ---------- 2. PRO TYPING SOUND (Web Audio) ----------
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    try {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        console.warn('Web Audio not supported');
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            // Pre-generate a small noise buffer once (for the mechanical "tick" attack)
            let noiseBuffer = null;
            function getNoiseBuffer() {
                if (noiseBuffer || !audioCtx) return noiseBuffer;
                const len = Math.floor(audioCtx.sampleRate * 0.05); // 50ms
                const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < len; i++) {
                    // Fast decay noise
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
                }
                noiseBuffer = buf;
                return noiseBuffer;
            }

            /**
             * Pro mechanical keyboard click — layered:
             *  1. Noise burst (mechanical "tick")
             *  2. High-freq tonal click (keycap contact)
             *  3. Low thock body (keycap bottom-out)
             * Random pitch + tiny timing jitter for realism.
             */
            function playTypeSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;

                // ----- Layer 1: Noise burst (click attack) -----
                const noiseSrc = audioCtx.createBufferSource();
                noiseSrc.buffer = getNoiseBuffer();

                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.value = 1800 + Math.random() * 1400;
                noiseFilter.Q.value = 0.9;

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.0001, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.14, now + 0.002);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);

                noiseSrc.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noiseSrc.start(now);
                noiseSrc.stop(now + 0.05);

                // ----- Layer 2: High tonal click (keycap) -----
                const clickOsc = audioCtx.createOscillator();
                clickOsc.type = 'square';
                const clickFreq = 2400 + Math.random() * 900;
                clickOsc.frequency.setValueAtTime(clickFreq, now);
                clickOsc.frequency.exponentialRampToValueAtTime(clickFreq * 0.6, now + 0.02);

                const clickGain = audioCtx.createGain();
                clickGain.gain.setValueAtTime(0.0001, now);
                clickGain.gain.exponentialRampToValueAtTime(0.055, now + 0.002);
                clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.028);

                clickOsc.connect(clickGain);
                clickGain.connect(audioCtx.destination);
                clickOsc.start(now);
                clickOsc.stop(now + 0.035);

                // ----- Layer 3: Low "thock" body -----
                const thockOsc = audioCtx.createOscillator();
                thockOsc.type = 'sine';
                const thockFreq = 130 + Math.random() * 60;
                thockOsc.frequency.setValueAtTime(thockFreq, now);
                thockOsc.frequency.exponentialRampToValueAtTime(thockFreq * 0.7, now + 0.045);

                const thockGain = audioCtx.createGain();
                thockGain.gain.setValueAtTime(0.0001, now);
                thockGain.gain.exponentialRampToValueAtTime(0.09, now + 0.004);
                thockGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.055);

                thockOsc.connect(thockGain);
                thockGain.connect(audioCtx.destination);
                thockOsc.start(now);
                thockOsc.stop(now + 0.06);
            }

            // Soft "enter" chime when typing finishes
            function playFinishSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                [660, 990, 1320].forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + i * 0.05);
                    gain.gain.setValueAtTime(0.0001, now + i * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.055, now + i * 0.05 + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.05 + 0.28);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.05);
                    osc.stop(now + i * 0.05 + 0.3);
                });
            }

            // Unlock audio on first user gesture (browser policy)
            document.addEventListener('click', initAudio, { once: true });
            document.addEventListener('keydown', initAudio, { once: true });
            document.addEventListener('touchstart', initAudio, { once: true });
            document.addEventListener('mousemove', initAudio, { once: true });

            // ---------- 3. TYPING SEQUENCE ----------
            const welcomeEl = document.getElementById('typedWelcome');
            const creditEl  = document.getElementById('typedCredit');
            const splash    = document.getElementById('splashScreen');
            const loginPage = document.getElementById('loginPage');

            const welcomeText = "Welcome Here";
            const creditParts = [
                { text: "Created with ", cls: '' },
                { text: "❤", cls: 'heart' },
                { text: " by Tartil Hossain", cls: '' }
            ];

            let welcomeIndex = 0;

            // Flatten credit into a char list with class info
            let creditChars = [];
            creditParts.forEach(part => {
                for (const ch of part.text) {
                    creditChars.push({ ch, cls: part.cls });
                }
            });
            let creditIndex = 0;

            function typeWelcome() {
                if (welcomeIndex < welcomeText.length) {
                    const ch = welcomeText.charAt(welcomeIndex);
                    welcomeEl.textContent += ch;
                    welcomeIndex++;
                    playTypeSound();
                    // Space gets a slightly longer pause for natural rhythm
                    const delay = ch === ' ' ? 140 : 68 + Math.random() * 46;
                    setTimeout(typeWelcome, delay);
                } else {
                    // Blinking cursor after welcome is complete
                    const cursor = document.createElement('span');
                    cursor.className = 'cursor';
                    welcomeEl.appendChild(cursor);
                    setTimeout(typeCredit, 430);
                }
            }

            function typeCredit() {
                if (creditIndex < creditChars.length) {
                    const { ch, cls } = creditChars[creditIndex];
                    if (cls === 'heart') {
                        const span = document.createElement('span');
                        span.className = 'heart';
                        span.textContent = ch;
                        creditEl.appendChild(span);
                    } else {
                        creditEl.appendChild(document.createTextNode(ch));
                    }
                    creditIndex++;
                    playTypeSound();
                    const delay = ch === ' ' ? 105 : 58 + Math.random() * 42;
                    setTimeout(typeCredit, delay);
                } else {
                    // Completion chime + fade out
                    playFinishSound();
                    setTimeout(() => {
                        splash.classList.add('fade-out-splash');
                        setTimeout(() => {
                            splash.style.display = 'none';
                            loginPage.style.display = 'block';
                            clearInterval(matrixInterval);
                        }, 950);
                    }, 900);
                }
            }

            // Kickoff
            setTimeout(() => {
                initAudio();
                typeWelcome();
            }, 450);
        })();

        async function makeRequest(action, params = {}) {
            try {
                const queryString = Object.keys(params)
                    .map(key => `${key}=${encodeURIComponent(params[key])}`)
                    .join('&');
                const url = `${GOOGLE_SHEETS_URL}?action=${action}${queryString ? '&' + queryString : ''}`;
                
                console.log('Request URL:', url);
                
                const response = await fetch(url);
                const text = await response.text();
                console.log('Response:', text);
                
                return JSON.parse(text);
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'Could not connect to Google Sheets. Error: ' + error.message, 'error');
                return { success: false, message: error.message };
            }
        }

                    announcements = data.updates || [];

        function renderAnnouncements() {
            const banner = document.getElementById('announcementBanner');
            const content = document.getElementById('announcementContent');
            
            if (announcements.length === 0) {
                banner.style.display = 'none';
                content.innerHTML = '';

            }
            
            banner.style.display = 'block';
            content.innerHTML = announcements.map(update => 
                `<div class="announcement-item">• ${update}</div>`
            ).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (allMembers.length === 0) {
                const colspan = currentUser.role === 'admin' ? 8 : 7;
                tbody.innerHTML = `<tr><td colspan="${colspan}" style="text-align:center; color: #5f6368;">No data available</td></tr>`;
                return;
            }
            
            allMembers.forEach((member, index) => {
                const isComplete = member.totalPaid >= MONTHLY_TARGET;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${member.memberName}</strong></td>
                    <td>৳${MONTHLY_TARGET}</td>
                    <td>৳${member.totalPaid}</td>
                    <td>${isComplete ? '<span class="badge badge-success">Complete</span>' : '<span class="badge badge-danger">Incomplete</span>'}</td>
                    <td>${member.totalMeals}</td>
                    <td><strong style="color:${member.refund >= 0 ? '#1e7e34' : '#d93025'};">৳${member.refund.toFixed(2)}</strong></td>
                    ${currentUser.role === 'admin' ? `
                        <td>

                                <button class="btn btn-warning btn-small" onclick="editMeals('${member.memberName}')">🍽️</button>

                            </div>
                        </td>
                    ` : ''}
                `;
                tbody.appendChild(row);
            });
        }

            document.getElementById('totalPaid').textContent = `৳${totalPaid}`;

                 <button class="buying-option-btn" style="background:#fce8e6;color:#d93025;border-color:#ea4335;" onclick="deleteUpdate(${index})">🗑️ Delete: ${update.substring(0, 30)}${update.length > 30 ? '...' : ''}</button>`

                inputPlaceholder: 'Enter your important update here...',
                showCancelButton: true,
                confirmButtonText: 'Add Update',
                cancelButtonText: 'Cancel',
                inputValidator: (value) => {
                    if (!value || value.trim() === '') {
                        return 'Please enter update text';
                    }
                }
            });
            
            if (updateText && updateText.trim()) {
                const result = await makeRequest('addUpdate', { update: updateText.trim() });

                    Swal.fire('Success', 'Update added successfully', 'success');
                    await loadAnnouncements();

        async function addAllBuying() {
            const { value: formValues } = await Swal.fire({
                title: 'Add All Buying Costs',
                html: `
                    <input id="buying-1" class="swal2-input" placeholder="1st Buying cost" type="number">
                    <input id="buying-2" class="swal2-input" placeholder="2nd Buying cost" type="number">
                    <input id="buying-3" class="swal2-input" placeholder="3rd Buying cost" type="number">
                    <input id="buying-4" class="swal2-input" placeholder="4th Buying cost" type="number">
                    <input id="buying-5" class="swal2-input" placeholder="5th Buying cost" type="number">
                    <input id="buying-6" class="swal2-input" placeholder="6th Buying cost" type="number">
                `,
                showCancelButton: true,
                confirmButtonText: 'Save All',
                cancelButtonText: 'Cancel',
                preConfirm: () => {
                    const buyingCosts = [];
                    for (let i = 1; i <= 6; i++) {
                        const cost = document.getElementById(`buying-${i}`).value;

                    }
                    return { buyingCosts };
                }
            });
            
            if (formValues) {
                const result = await makeRequest('addBuying', { buyingCosts: JSON.stringify(formValues.buyingCosts) });
                if (result.success) {
                    Swal.fire('Success', result.message, 'success');
                    await loadData();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function calculateAll() {
            const confirm = await Swal.fire({
                title: 'Calculate All?',
                text: 'This will calculate the meal rate and update all refunds',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, Calculate',
                cancelButtonText: 'Cancel'
            });
            
            if (confirm.isConfirmed) {
                const result = await makeRequest('calculateAll');
                console.log('Calculate result:', result);
                
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Calculation Complete!',
                        html: `
                            <p>Total Buying Cost: ৳${result.totalBuyingCost}</p>
                            <p>Total Meals: ${result.totalMeals}</p>
                            <p>Meal Rate: ৳${result.mealRate} per meal</p>
                        `,
                        confirmButtonText: 'OK'
                    }).then(() => {
                        loadData();
                    });
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function startNewMonth() {
            const confirm = await Swal.fire({
                title: 'Start New Month?',
                text: 'This will reset all payment, meals, and buying data for the new month. Member names will remain. This action cannot be undone!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, Start New Month',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6'
            });
            
            if (confirm.isConfirmed) {
                const result = await makeRequest('startNewMonth');
                console.log('Start new month result:', result);
                
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'New Month Started!',
                        text: result.message,
                        confirmButtonText: 'OK'
                    }).then(() => {
                        loadData();
                    });
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function addMember() {
            const { value: name } = await Swal.fire({
                title: 'Add new member',
                input: 'text',
                inputLabel: 'Member name',
                inputPlaceholder: 'Enter member name',
                showCancelButton: true,
                confirmButtonText: 'Add Member',
                cancelButtonText: 'Cancel',
                inputValidator: (value) => {
                    if (!value || value.trim() === '') return 'Please enter a member name';
                }
            });
            
            if (name && name.trim()) {
                const result = await makeRequest('addMember', { memberName: name.trim() });
                if (result.success) {
                    Swal.fire('Success', result.message, 'success');
                    await loadData();
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            }
        }

        async function refreshData() {
            await loadData();
            await loadAnnouncements();
            Swal.fire('Refreshed', 'Data updated successfully', 'success');
        }
    </script>
</body>
  </html>
