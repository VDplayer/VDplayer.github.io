<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হোস্টেল ফুড ম্যানেজমেন্ট সিস্টেম</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Login Styles */
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            margin: 100px auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-box h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-field {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .hint {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-top: 5px;
        }

        /* Header Styles */
        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card p {
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }

        /* Buttons */
        .btn-primary {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            padding: 10px 20px;
            background: #f56565;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: #e53e3e;
        }

        .btn-success {
            padding: 12px 24px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
            transition: all 0.3s;
        }

        .btn-success:hover {
            background: #38a169;
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-danger {
            padding: 8px 16px;
            background: #f56565;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin: 2px;
            transition: all 0.3s;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-warning {
            padding: 8px 16px;
            background: #ed8936;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin: 2px;
            transition: all 0.3s;
        }

        .btn-warning:hover {
            background: #dd6b20;
        }

        .admin-controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Table Styles */
        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f7fafc;
        }

        /* Status Indicators */
        .status-complete {
            background: #48bb78;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .status-incomplete {
            background: #f56565;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .view-only {
            color: #999;
            font-size: 14px;
        }

        /* Loading Spinner */
        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            
            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 10px;
            }
            
            .login-box {
                margin: 50px auto;
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="container">
        <div class="login-box">
            <h1>🍽️ হোস্টেল ফুড ম্যানেজমেন্ট</h1>
            <p class="subtitle">মেস ম্যানেজমেন্ট সিস্টেম</p>
            <div class="login-form">
                <input type="text" id="username" placeholder="আপনার নাম লিখুন" class="input-field">
                <input type="password" id="password" placeholder="পাসওয়ার্ড (ঐচ্ছিক)" class="input-field">
                <button onclick="login()" class="btn-primary">লগইন করুন</button>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="container" style="display: none;">
        <header class="header">
            <h1>🍽️ হোস্টেল ফুড ম্যানেজমেন্ট</h1>
            <div class="user-info">
                <span id="loggedUser"></span>
                <button onclick="logout()" class="btn-secondary">লগআউট</button>
            </div>
        </header>

        <div class="dashboard-content">
            <!-- Summary Cards -->
            <div class="summary-cards">
                <div class="card">
                    <h3>মোট সদস্য</h3>
                    <p id="totalMembers">0</p>
                </div>
                <div class="card">
                    <h3>মোট জমা</h3>
                    <p id="totalPaid">₹0</p>
                </div>
                <div class="card">
                    <h3>মোট খরচ</h3>
                    <p id="totalCost">₹0</p>
                </div>
                <div class="card">
                    <h3>মোট মিল</h3>
                    <p id="totalMeals">0</p>
                </div>
            </div>

            <!-- Admin Controls -->
            <div id="adminControls" style="display: none;" class="admin-controls">
                <button onclick="calculateAll()" class="btn-success">🔄 Calculate All</button>
                <button onclick="addMember()" class="btn-primary">➕ Add Member</button>
                <button onclick="refreshData()" class="btn-secondary">🔄 Refresh Data</button>
            </div>

            <!-- Main Table -->
            <div class="table-container">
                <table id="memberTable">
                    <thead>
                        <tr>
                            <th>ক্রমিক</th>
                            <th>সদস্যের নাম</th>
                            <th>মাসিক লক্ষ্য (৳)</th>
                            <th>মোট জমা (৳)</th>
                            <th>জমা সম্পূর্ণ?</th>
                            <th>মিল সংখ্যা</th>
                            <th>প্রতি মিলের খরচ (৳)</th>
                            <th>মাসিক খরচ (৳)</th>
                            <th>ফেরত পাবে (৳)</th>
                            <th>অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Dynamic content will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // তোমার Google Apps Script Web App URL
        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbwJfWNkHDwdhk1-ji4ZSlVSrm5geO-hjisvDz-8BGuB2l6Sj42rosALsPQ-iqIU7cx_/exec";
        const MONTHLY_TARGET = 2300; // জনপ্রতি মাসিক লক্ষ্য

        let currentUser = null;
        let allMembers = [];

        // Default members
        const defaultMembers = [
            { memberName: "তারতিল", totalPaid: 0, totalMeals: 60, mealCost: 38.33, monthlyCost: 2300, refund: -2300 },
            { memberName: "সাবাব", totalPaid: 0, totalMeals: 60, mealCost: 38.33, monthlyCost: 2300, refund: -2300 },
            { memberName: "জাহিদ", totalPaid: 0, totalMeals: 60, mealCost: 38.33, monthlyCost: 2300, refund: -2300 },
            { memberName: "মেহেদী", totalPaid: 0, totalMeals: 60, mealCost: 38.33, monthlyCost: 2300, refund: -2300 },
            { memberName: "সাদমান", totalPaid: 0, totalMeals: 60, mealCost: 38.33, monthlyCost: 2300, refund: -2300 },
            { memberName: "নাফি", totalPaid: 0, totalMeals: 60, mealCost: 38.33, monthlyCost: 2300, refund: -2300 },
            { memberName: "মাহিন", totalPaid: 0, totalMeals: 60, mealCost: 38.33, monthlyCost: 2300, refund: -2300 }
        ];

        // Initialize default data in Google Sheets
        async function initializeDefaultData() {
            try {
                // Check if data exists
                const response = await fetch(`${GOOGLE_SHEETS_URL}?action=getAllData`);
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    // Add default members
                    for (const member of defaultMembers) {
                        await fetch(`${GOOGLE_SHEETS_URL}?action=addMember&memberName=${encodeURIComponent(member.memberName)}`);
                    }
                    console.log("Default members added to Google Sheets");
                }
            } catch (error) {
                console.error("Error initializing data:", error);
                // Fallback to local data
                allMembers = [...defaultMembers];
            }
        }

        // Login Function
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username) {
                Swal.fire({
                    icon: 'error',
                    title: 'ত্রুটি',
                    text: 'আপনার নাম লিখুন'
                });
                return;
            }
            
            // Admin check
            if (password === "66!") {
                currentUser = { name: "Admin", role: "admin" };
                await loadDashboard();
                return;
            }
            
            // User login (no password required)
            if (!password) {
                currentUser = { name: username, role: "user" };
                await loadDashboard();
                return;
            }
            
            Swal.fire({
                icon: 'error',
                title: 'ত্রুটি',
                text: 'ভুল পাসওয়ার্ড'
            });
        }

        // Logout Function
        function logout() {
            currentUser = null;
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Load Dashboard
        async function loadDashboard() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('loggedUser').textContent = `👤 ${currentUser.name} (${currentUser.role === 'admin' ? 'Admin' : 'User'})`;
            
            if (currentUser.role === 'admin') {
                document.getElementById('adminControls').style.display = 'flex';
            } else {
                document.getElementById('adminControls').style.display = 'none';
            }
            
            await loadDataFromGoogleSheets();
            renderTable();
            updateSummary();
        }

        // Load data from Google Sheets
        async function loadDataFromGoogleSheets() {
            try {
                const response = await fetch(`${GOOGLE_SHEETS_URL}?action=getAllData`);
                const data = await response.json();
                
                if (data && data.length > 0) {
                    allMembers = data;
                } else {
                    allMembers = [...defaultMembers];
                }
            } catch (error) {
                console.error("Error loading data:", error);
                allMembers = [...defaultMembers];
            }
        }

        // Refresh Data
        async function refreshData() {
            Swal.fire({
                title: 'লোড হচ্ছে...',
                text: 'ডেটা রিফ্রেশ করা হচ্ছে',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });
            
            await loadDataFromGoogleSheets();
            renderTable();
            updateSummary();
            
            Swal.close();
            Swal.fire({
                icon: 'success',
                title: 'সফল',
                text: 'ডেটা রিফ্রেশ হয়েছে',
                timer: 1500
            });
        }

        // Render Table
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (allMembers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="loading">কোনো ডেটা নেই</td></tr>';
                return;
            }
            
            allMembers.forEach((member, index) => {
                const row = document.createElement('tr');
                const isComplete = member.totalPaid >= MONTHLY_TARGET;
                const refund = member.totalPaid - member.monthlyCost;
                member.refund = refund;
                
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${member.memberName}</strong></td>
                    <td>₹${MONTHLY_TARGET}</td>
                    <td>₹${member.totalPaid.toFixed(2)}</td>
                    <td>
                        ${isComplete ? 
                            '<span class="status-complete">✓ সম্পূর্ণ</span>' : 
                            '<span class="status-incomplete">✗ অসম্পূর্ণ</span>'}
                    </td>
                    <td>${member.totalMeals}</td>
                    <td>₹${member.mealCost.toFixed(2)}</td>
                    <td>₹${member.monthlyCost.toFixed(2)}</td>
                    <td>
                        ${refund >= 0 ? 
                            `<strong style="color: #48bb78;">₹${refund.toFixed(2)}</strong>` : 
                            `<strong style="color: #f56565;">₹${refund.toFixed(2)}</strong>`}
                    </td>
                    <td>
                        ${currentUser.role === 'admin' ? `
                            <button class="btn-danger" onclick="editPayment('${member.memberName}')" title="টাকা যোগ করুন">💰</button>
                            <button class="btn-warning" onclick="editMeals('${member.memberName}')" title="মিল পরিবর্তন">🍽️</button>
                            <button class="btn-secondary" onclick="deleteMember('${member.memberName}')" title="সদস্য মুছুন">🗑️</button>
                        ` : '<span class="view-only">👁️ View Only</span>'}
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // Update Summary
        function updateSummary() {
            const totalPaid = allMembers.reduce((sum, m) => sum + m.totalPaid, 0);
            const totalCost = allMembers.reduce((sum, m) => sum + m.monthlyCost, 0);
            const totalMeals = allMembers.reduce((sum, m) => sum + m.totalMeals, 0);
            
            document.getElementById('totalMembers').textContent = allMembers.length;
            document.getElementById('totalPaid').textContent = `₹${totalPaid.toFixed(2)}`;
            document.getElementById('totalCost').textContent = `₹${totalCost.toFixed(2)}`;
            document.getElementById('totalMeals').textContent = totalMeals;
        }

        // Edit Payment (Admin only)
        async function editPayment(memberName) {
            const member = allMembers.find(m => m.memberName === memberName);
            
            const { value: amount } = await Swal.fire({
                title: `💰 ${memberName} এর জন্য টাকা যোগ করুন`,
                input: 'number',
                inputLabel: 'টাকার পরিমাণ',
                inputPlaceholder: 'কত টাকা জমা দিল?',
                inputAttributes: {
                    min: '0',
                    step: '1'
                },
                showCancelButton: true,
                confirmButtonText: 'যোগ করুন',
                cancelButtonText: 'বাতিল'
            });
            
            if (amount && amount > 0) {
                try {
                    const response = await fetch(`${GOOGLE_SHEETS_URL}?action=updatePayment&memberName=${encodeURIComponent(memberName)}&amount=${amount}`);
                    const result = await response.text();
                    
                    member.totalPaid += parseFloat(amount);
                    member.refund = member.totalPaid - member.monthlyCost;
                    renderTable();
                    updateSummary();
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'সফল',
                        text: `${memberName} এর জন্য ₹${amount} যোগ করা হয়েছে`
                    });
                } catch (error) {
                    console.error("Error:", error);
                    Swal.fire({
                        icon: 'error',
                        title: 'ত্রুটি',
                        text: 'Google Sheets-এ সেভ করা যায়নি'
                    });
                }
            }
        }

        // Edit Meals (Admin only)
        async function editMeals(memberName) {
            const member = allMembers.find(m => m.memberName === memberName);
            
            const { value: meals } = await Swal.fire({
                title: `🍽️ ${memberName} এর মিল সংখ্যা পরিবর্তন করুন`,
                input: 'number',
                inputLabel: 'মোট মিল সংখ্যা',
                inputValue: member.totalMeals,
                inputAttributes: {
                    min: '0',
                    step: '1'
                },
                showCancelButton: true,
                confirmButtonText: 'আপডেট',
                cancelButtonText: 'বাতিল'
            });
            
            if (meals !== undefined && meals !== null) {
                const mealCost = MONTHLY_TARGET / meals;
                
                try {
                    const response = await fetch(`${GOOGLE_SHEETS_URL}?action=updateMeals&memberName=${encodeURIComponent(memberName)}&meals=${meals}&mealCost=${mealCost}`);
                    const result = await response.text();
                    
                    member.totalMeals = parseInt(meals);
                    member.mealCost = mealCost;
                    member.monthlyCost = member.totalMeals * member.mealCost;
                    member.refund = member.totalPaid - member.monthlyCost;
                    renderTable();
                    updateSummary();
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'সফল',
                        text: `${memberName} এর মিল সংখ্যা আপডেট হয়েছে`
                    });
                } catch (error) {
                    console.error("Error:", error);
                    Swal.fire({
                        icon: 'error',
                        title: 'ত্রুটি',
                        text: 'Google Sheets-এ সেভ করা যায়নি'
                    });
                }
            }
        }

        // Calculate All
        async function calculateAll() {
            Swal.fire({
                title: 'হিসাব করা হচ্ছে...',
                text: 'সকল ডেটা আপডেট হচ্ছে',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });
            
            try {
                const response = await fetch(`${GOOGLE_SHEETS_URL}?action=calculateAll`);
                const result = await response.text();
                
                await loadDataFromGoogleSheets();
                renderTable();
                updateSummary();
                
                Swal.close();
                Swal.fire({
                    icon: 'success',
                    title: 'হিসাব সম্পন্ন',
                    text: 'সকল হিসাব সঠিকভাবে আপডেট করা হয়েছে',
                    timer: 2000
                });
            } catch (error) {
                console.error("Error:", error);
                Swal.close();
                Swal.fire({
                    icon: 'error',
                    title: 'ত্রুটি',
                    text: 'হিসাব করা যায়নি'
                });
            }
        }

        // Add Member (Admin only)
        async function addMember() {
            const { value: name } = await Swal.fire({
                title: 'নতুন সদস্য যোগ করুন',
                input: 'text',
                inputLabel: 'সদস্যের নাম',
                inputPlaceholder: 'নাম লিখুন',
                showCancelButton: true,
                confirmButtonText: 'যোগ করুন',
                cancelButtonText: 'বাতিল',
                inputValidator: (value) => {
                    if (!value) {
                        return 'নাম লিখতে হবে!';
                    }
                }
            });
            
            if (name) {
                try {
