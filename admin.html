<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyRoom — Admin Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  .admin-tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.25rem; background: #f1f5f9; color: #334155;
    border: 1px solid #e2e8f0; transition: all 0.15s;
  }
  .admin-tab.active { background: #1e293b; color: #ffffff !important; border-color: #1e293b; }
  .admin-tab.active * { color: #ffffff !important; }
  .q-block { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .opt-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🔐</div>
      <h1 class="text-2xl font-black text-purple-700">StudyRoom Admin</h1>
      <p class="text-slate-500 text-sm mt-1">Authorized personnel only</p>
    </div>
    <input id="admEmail" type="email" placeholder="Admin email" class="w-full border rounded-lg px-3 py-2 mb-3" />
    <input id="admPass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')adminLogin()" class="w-full border rounded-lg px-3 py-2 mb-3" />
    <p id="admErr" class="text-red-500 text-sm mb-3"></p>
    <button onclick="adminLogin()" id="loginBtn" class="gradient text-white w-full py-3 rounded-lg font-semibold">Sign In</button>
    <div class="text-center mt-4"><a href="index.html" class="text-sm text-slate-500 hover:text-purple-600 underline">← Back to site</a></div>
  </div>
</div>

<div id="panelScreen" class="hidden max-w-6xl mx-auto px-4 py-8">
  <div class="bg-white rounded-2xl p-6 shadow mb-6 flex justify-between items-center flex-wrap gap-3">
    <div>
      <h1 class="text-2xl font-black text-purple-700">📚 StudyRoom Admin</h1>
      <p class="text-sm text-slate-500" id="adminEmailLabel"></p>
    </div>
    <button onclick="adminLogout()" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-semibold text-sm">Logout</button>
  </div>

  <div class="bg-white rounded-2xl p-6 shadow">
    <div class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6">
      <button onclick="adminTab('subs')" id="tabBtn-subs" class="admin-tab p-4 rounded-lg font-semibold"><div class="text-2xl">👥</div><div class="text-sm">Subscribers</div></button>
      <button onclick="adminTab('pays')" id="tabBtn-pays" class="admin-tab p-4 rounded-lg font-semibold"><div class="text-2xl">💳</div><div class="text-sm">Payments</div></button>
      <button onclick="adminTab('notes')" id="tabBtn-notes" class="admin-tab p-4 rounded-lg font-semibold"><div class="text-2xl">📄</div><div class="text-sm">Notes</div></button>
      <button onclick="adminTab('tests')" id="tabBtn-tests" class="admin-tab p-4 rounded-lg font-semibold"><div class="text-2xl">🧪</div><div class="text-sm">Tests</div></button>
      <button onclick="adminTab('updates')" id="tabBtn-updates" class="admin-tab p-4 rounded-lg font-semibold"><div class="text-2xl">📢</div><div class="text-sm">Updates</div></button>
      <button onclick="adminTab('comments')" id="tabBtn-comments" class="admin-tab p-4 rounded-lg font-semibold"><div class="text-2xl">💬</div><div class="text-sm">Comments</div></button>
    </div>

    <div id="adminRevenue" class="bg-green-50 border border-green-200 rounded-xl p-4 mb-6"></div>

    <div id="admin-subs" class="admin-content"></div>
    <div id="admin-pays" class="admin-content hidden"></div>
    <div id="admin-notes" class="admin-content hidden"></div>
    <div id="admin-tests" class="admin-content hidden"></div>
    <div id="admin-updates" class="admin-content hidden"></div>
    <div id="admin-comments" class="admin-content hidden"></div>
  </div>
</div>

<div id="loader" class="hidden fixed inset-0 bg-black/40 z-[100] items-center justify-center">
  <div class="bg-white px-6 py-4 rounded-lg font-semibold">Please wait...</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxaHvL7ILOxespnNpNmWKtGWQ1n5TxYN0g5wX_CSfURLid16klpQ5VCXGECwXAUrZXq/exec";
let adminUser = null;
let newQuestions = [{ question: '', options: ['', '', '', ''], correct: 0 }];

async function api(action, data = {}) {
  showLoader(true);
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...data })
    });
    return await r.json();
  } catch (e) { console.error(e); return { error: 'Network error' }; }
  finally { showLoader(false); }
}

function showLoader(v) {
  const el = document.getElementById('loader');
  el.classList.toggle('hidden', !v);
  el.style.display = v ? 'flex' : 'none';
}

async function adminLogin() {
  const email = document.getElementById('admEmail').value.trim();
  const pass  = document.getElementById('admPass').value;
  const errEl = document.getElementById('admErr');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Fill both fields'; return; }
  document.getElementById('loginBtn').textContent = 'Checking...';
  const res = await api('adminLogin', { email, pass });
  document.getElementById('loginBtn').textContent = 'Sign In';
  if (res.ok) {
    adminUser = { email, loggedInAt: Date.now() };
    localStorage.setItem('studyroom_admin', JSON.stringify(adminUser));
    enterPanel();
  } else errEl.textContent = res.error || 'Invalid credentials';
}

function enterPanel() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('panelScreen').classList.remove('hidden');
  document.getElementById('adminEmailLabel').textContent = 'Logged in as ' + adminUser.email;
  adminTab('subs');
  loadAdmin();
}

function adminLogout() {
  localStorage.removeItem('studyroom_admin');
  adminUser = null;
  document.getElementById('panelScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('admEmail').value = '';
  document.getElementById('admPass').value = '';
}

function adminTab(name) {
  document.querySelectorAll('.admin-content').forEach(c => c.classList.add('hidden'));
  document.getElementById('admin-' + name).classList.remove('hidden');
  document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
  document.getElementById('tabBtn-' + name).classList.add('active');
}

async function loadAdmin() {
  const res = await api('adminData');
  if (res.error) return alert(res.error);

  document.getElementById('adminRevenue').innerHTML = `
    <div class="text-sm text-slate-500">Total Revenue</div>
    <div class="text-3xl font-black text-green-700">${res.revenue}৳</div>
    <div class="text-xs text-slate-500 mt-1">${res.users.filter(u => u.status === 'active').length} active · ${res.payments.filter(p=>p.status==='Pending').length} pending</div>`;

  const latestPay = {};
  res.payments.forEach(p => {
    const e = (p.email || '').toLowerCase();
    if (!latestPay[e]) latestPay[e] = p;
  });

  /* SUBS */
  document.getElementById('admin-subs').innerHTML = `
    <h3 class="font-bold text-lg mb-3">👥 All Subscribers</h3>
    <div class="overflow-x-auto"><table class="w-full text-sm">
    <thead><tr class="bg-slate-100">
      <th class="p-2 text-left">Name</th><th class="p-2 text-left">Email</th>
      <th class="p-2">Plan</th><th class="p-2">Status</th>
      <th class="p-2">Expires</th><th class="p-2">Streak</th><th class="p-2">Joined</th>
    </tr></thead>
    <tbody>${res.users.map(u => {
      const k = (u.email || '').toLowerCase();
      const pay = latestPay[k];
      let displayPlan = u.plan || (pay ? pay.plan : '') || '—';
      let status = 'none';
      if (u.status === 'active') status = 'active';
      else if (u.status === 'expired') status = 'expired';
      else if (pay) status = (pay.status || '').toLowerCase();
      else status = u.status || 'none';

      let badge = '';
      if (status === 'active' || status === 'approved') badge = `<span class="px-2 py-1 rounded text-xs font-semibold bg-green-100 text-green-700">Active</span>`;
      else if (status === 'pending') badge = `<span class="px-2 py-1 rounded text-xs font-semibold bg-yellow-100 text-yellow-700">Pending</span>`;
      else if (status === 'rejected') badge = `<span class="px-2 py-1 rounded text-xs font-semibold bg-red-100 text-red-700">Rejected</span>`;
      else if (status === 'expired') badge = `<span class="px-2 py-1 rounded text-xs font-semibold bg-orange-100 text-orange-700">Expired</span>`;
      else badge = `<span class="px-2 py-1 rounded text-xs font-semibold bg-slate-100 text-slate-600">None</span>`;

      const exp = u.expiresAt ? new Date(u.expiresAt).toLocaleDateString() : '—';
      return `
      <tr class="border-b ${status === 'expired' ? 'bg-orange-50' : ''}">
        <td class="p-2">${u.name || ''}</td>
        <td class="p-2 text-xs">${u.email}</td>
        <td class="p-2 text-center font-semibold">${displayPlan}</td>
        <td class="p-2 text-center">${badge}</td>
        <td class="p-2 text-center text-xs">${exp}</td>
        <td class="p-2 text-center font-bold text-orange-600">${u.streak ? '🔥 ' + u.streak : '—'}</td>
        <td class="p-2 text-xs text-slate-500">${u.joined ? new Date(u.joined).toLocaleDateString() : ''}</td>
      </tr>`;
    }).join('')}</tbody></table></div>`;

  /* PAYS */
  document.getElementById('admin-pays').innerHTML = `
    <h3 class="font-bold text-lg mb-3">💳 Payment Approvals</h3>
    ${res.payments.length ? res.payments.map(p => `
      <div class="border rounded-lg p-3 mb-2 flex justify-between items-center flex-wrap gap-2">
        <div>
          <div class="font-semibold">${p.email} → ${p.plan} (${p.amount}৳)</div>
          <div class="text-xs text-slate-500">ID: ${p.id} | TrxID: ${p.trxId || '—'}</div>
          ${p.screenshot ? `<a href="${p.screenshot}" target="_blank" class="text-blue-600 text-xs underline">Screenshot</a>` : ''}
          ${p.invoiceUrl ? `<a href="${p.invoiceUrl}" target="_blank" class="text-purple-600 text-xs underline ml-2">📄 Invoice</a>` : ''}
        </div>
        <div class="flex gap-2 items-center">
          <span class="text-xs px-2 py-1 rounded ${p.status === 'Approved' ? 'bg-green-100 text-green-700' : p.status === 'Rejected' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}">${p.status}</span>
          ${p.status === 'Pending' ? `
            <button onclick="approvePay('${p.id}')" class="bg-green-600 text-white px-3 py-1 rounded text-xs">Approve</button>
            <button onclick="rejectPay('${p.id}')" class="bg-red-600 text-white px-3 py-1 rounded text-xs">Reject</button>
          ` : ''}
        </div>
      </div>`).join('') : '<p class="text-slate-500">No payments yet.</p>'}`;

  /* NOTES */
  document.getElementById('admin-notes').innerHTML = `
    <h3 class="font-bold text-lg mb-3">📄 Upload Notes (PDF)</h3>
    <div class="border p-4 rounded-lg max-w-lg mb-4">
      <label class="text-sm font-semibold">Tier</label>
      <select id="noteTier" class="w-full border rounded px-3 py-2 mb-3 mt-1"><option>Basic</option><option>Pro</option></select>
      <label class="text-sm font-semibold">Title</label>
      <input id="noteTitle" placeholder="e.g. Physics Chapter 1" class="w-full border rounded px-3 py-2 mb-3 mt-1" />
      <label class="text-sm font-semibold">PDF</label>
      <input id="notePdf" type="file" accept=".pdf" class="w-full border rounded px-3 py-2 mb-3 mt-1" />
      <button onclick="addNote()" class="gradient text-white px-4 py-2 rounded w-full">Upload Note</button>
    </div>
    <h3 class="font-bold text-lg mt-6 mb-3">Current Notes</h3>
    ${res.notes.length ? res.notes.map(n => `
      <div class="flex justify-between items-center border-b py-2">
        <div><b>${n.tier}</b> — ${n.title}</div>
        <button onclick="removeNote('${n.tier}','${(n.title || '').replace(/'/g, "\\'")}')" class="text-red-500 text-sm">Remove</button>
      </div>`).join('') : '<p class="text-slate-500">No notes uploaded.</p>'}`;

  /* TESTS */
  document.getElementById('admin-tests').innerHTML = `
    <h3 class="font-bold text-lg mb-3">🧪 Create Mock Test</h3>
    <div class="border p-4 rounded-lg mb-4">
      <div class="grid md:grid-cols-3 gap-3 mb-3">
        <div><label class="text-sm font-semibold">Title</label>
        <input id="testTitle" placeholder="Physics Mock 1" class="w-full border rounded px-3 py-2 mt-1" /></div>
        <div><label class="text-sm font-semibold">Tier</label>
        <select id="testTier" class="w-full border rounded px-3 py-2 mt-1"><option>Basic</option><option>Pro</option></select></div>
        <div><label class="text-sm font-semibold">Duration (min)</label>
        <input id="testDuration" type="number" value="10" min="1" class="w-full border rounded px-3 py-2 mt-1" /></div>
      </div>
      <h4 class="font-semibold mb-2">Questions</h4>
      <div id="questionsContainer"></div>
      <button onclick="addQuestion()" class="bg-slate-800 text-white px-4 py-2 rounded text-sm mb-3">+ Add Question</button><br>
      <button onclick="submitTest()" class="gradient text-white px-6 py-2 rounded font-semibold">Save Test</button>
    </div>
    <h3 class="font-bold text-lg mt-6 mb-3">Existing Tests</h3>
    ${res.tests.length ? res.tests.map(t => `
      <div class="flex justify-between items-center border-b py-2">
        <div><b>${t.title}</b> · ${t.tier} · ${t.questionCount} Q · ${t.duration} min</div>
        <button onclick="removeTest('${t.id}')" class="text-red-500 text-sm">Remove</button>
      </div>`).join('') : '<p class="text-slate-500">No tests yet.</p>'}`;

  renderQuestions();

  /* UPDATES */
  document.getElementById('admin-updates').innerHTML = `
    <h3 class="font-bold text-lg mb-3">📢 Post Update to All Users</h3>
    <div class="border p-4 rounded-lg max-w-lg mb-6">
      <input id="updTitle" placeholder="Title" class="w-full border rounded px-3 py-2 mb-3" />
      <textarea id="updMsg" placeholder="Message" rows="4" class="w-full border rounded px-3 py-2 mb-3"></textarea>
      <button onclick="postUpdate()" class="gradient text-white px-4 py-2 rounded w-full">Post Update</button>
    </div>
    <h3 class="font-bold text-lg mb-3">Recent Updates</h3>
    ${res.updates.length ? res.updates.map(u => `
      <div class="border-l-4 border-purple-500 pl-3 py-2 mb-2">
        <div class="font-semibold">${u.title}</div>
        <div class="text-sm text-slate-600">${u.message}</div>
      </div>`).join('') : '<p class="text-slate-500">No updates yet.</p>'}`;

  /* COMMENTS */
  document.getElementById('admin-comments').innerHTML = `
    <h3 class="font-bold text-lg mb-3">💬 Recent Comments</h3>
    ${res.comments.length ? res.comments.map(c => `
      <div class="border rounded-lg p-3 mb-2">
        <div class="text-xs text-slate-500 mb-1">
          <b>${c.email}</b> on <b>${c.noteTitle}</b> · ${new Date(c.date).toLocaleString()}
        </div>
        <div class="text-sm mb-2">${(c.message || '').replace(/</g,'&lt;')}</div>
        <button onclick="removeComment('${c.email}','${(c.noteTitle || '').replace(/'/g,"\\'")}','${(c.message || '').replace(/'/g,"\\'").replace(/\n/g,' ')}')" class="text-red-500 text-xs">Delete</button>
      </div>`).join('') : '<p class="text-slate-500">No comments yet.</p>'}`;
}

function renderQuestions() {
  const el = document.getElementById('questionsContainer');
  if (!el) return;
  el.innerHTML = newQuestions.map((q, i) => `
    <div class="q-block">
      <div class="flex justify-between items-center mb-2">
        <div class="font-semibold text-sm">Question ${i+1}</div>
        ${newQuestions.length > 1 ? `<button onclick="removeQuestion(${i})" class="text-red-500 text-xs">Remove</button>` : ''}
      </div>
      <input placeholder="Question text" value="${(q.question || '').replace(/"/g, '&quot;')}" oninput="newQuestions[${i}].question = this.value" class="w-full border rounded px-3 py-2 mb-2" />
      ${q.options.map((opt, j) => `
        <div class="opt-row">
          <input type="radio" name="correct${i}" ${q.correct === j ? 'checked' : ''} onchange="newQuestions[${i}].correct = ${j}" />
          <input placeholder="Option ${j+1}" value="${(opt || '').replace(/"/g, '&quot;')}" oninput="newQuestions[${i}].options[${j}] = this.value" class="flex-1 border rounded px-3 py-1" />
        </div>`).join('')}
      <div class="text-xs text-slate-500 mt-1">Click a radio to mark correct</div>
    </div>`).join('');
}

function addQuestion() {
  newQuestions.push({ question: '', options: ['', '', '', ''], correct: 0 });
  renderQuestions();
}
function removeQuestion(i) {
  newQuestions.splice(i, 1);
  renderQuestions();
}

async function approvePay(id) { await api('approvePayment', { id }); loadAdmin(); }
async function rejectPay(id)  { await api('rejectPayment', { id }); loadAdmin(); }

async function postUpdate() {
  const title = document.getElementById('updTitle').value.trim();
  const message = document.getElementById('updMsg').value.trim();
  if (!title) return alert('Title required');
  await api('postUpdate', { title, message });
  alert('✅ Posted!'); loadAdmin();
}

async function addNote() {
  const tier = document.getElementById('noteTier').value;
  const title = document.getElementById('noteTitle').value.trim();
  const file = document.getElementById('notePdf').files[0];
  if (!title) return alert('Title required');
  if (!file) return alert('Select a PDF');
  const reader = new FileReader();
  reader.onload = async e => {
    const res = await api('addNote', { tier, title, pdf: e.target.result });
    if (res.success) { alert('✅ Uploaded!'); loadAdmin(); }
    else alert('❌ ' + res.error);
  };
  reader.readAsDataURL(file);
}

async function removeNote(tier, title) {
  if (!confirm('Remove this note?')) return;
  await api('removeNote', { tier, title });
  loadAdmin();
}

async function submitTest() {
  const title = document.getElementById('testTitle').value.trim();
  const tier = document.getElementById('testTier').value;
  const duration = Number(document.getElementById('testDuration').value) || 10;
  if (!title) return alert('Test title required');
  const questions = newQuestions.map(q => ({
    question: q.question.trim(),
    options: q.options.map(o => o.trim()),
    correct: q.correct
  })).filter(q => q.question && q.options.filter(o=>o).length >= 2);
  if (!questions.length) return alert('At least one valid question required');
  const res = await api('addTest', { title, tier, duration, questions });
  if (res.success) {
    alert('✅ Test saved!');
    newQuestions = [{ question: '', options: ['', '', '', ''], correct: 0 }];
    loadAdmin();
  } else alert('❌ ' + res.error);
}

async function removeTest(testId) {
  if (!confirm('Remove this test?')) return;
  await api('removeTest', { testId });
  loadAdmin();
}

async function removeComment(email, noteTitle, message) {
  if (!confirm('Delete this comment?')) return;
  await api('removeComment', { email, noteTitle, message });
  loadAdmin();
}

window.addEventListener('load', () => {
  const saved = localStorage.getItem('studyroom_admin');
  if (saved) {
    try {
      adminUser = JSON.parse(saved);
      api('verifyAdmin', { email: adminUser.email }).then(r => {
        if (r.ok) enterPanel();
        else localStorage.removeItem('studyroom_admin');
      });
    } catch (e) { localStorage.removeItem('studyroom_admin'); }
  }
});
</script>
</body>
</html>
