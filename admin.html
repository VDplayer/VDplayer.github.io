<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyRoom — Admin Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
  * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #f5f7fb;
    color: #0f172a;
    overflow-x: hidden;
  }
  h1, h2, h3 { font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.02em; }

  :root {
    --sidebar-bg: #0f172a;
    --primary: #667eea;
    --primary-dark: #764ba2;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #e2e8f0;
    --text-muted: #64748b;
  }

  /* LOGIN */
  .login-bg {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(at 20% 20%, rgba(102,126,234,0.15) 0px, transparent 50%),
      radial-gradient(at 80% 0%, rgba(240,147,251,0.12) 0px, transparent 50%),
      radial-gradient(at 0% 80%, rgba(79,172,254,0.12) 0px, transparent 50%),
      #f5f7fb;
  }
  .login-card {
    background: white;
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 20px 60px rgba(15, 23, 42, 0.08);
    border: 1px solid rgba(226, 232, 240, 0.6);
  }
  .login-logo {
    width: 64px; height: 64px;
    border-radius: 18px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 32px;
    box-shadow: 0 12px 30px rgba(102, 126, 234, 0.35);
  }
  .login-title {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 20px 0 8px;
  }
  .input-field {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    font-size: 15px;
    outline: none;
    transition: all 0.2s;
    background: white;
    font-family: inherit;
  }
  .input-field:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
  }
  .btn-signin {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    font-weight: 700;
    font-size: 16px;
    border: none;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.35);
    font-family: inherit;
  }
  .btn-signin:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
  }

  /* LAYOUT */
  .admin-layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    min-height: 100vh;
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--sidebar-bg);
    color: #cbd5e1;
    padding: 24px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    box-shadow: 4px 0 24px rgba(15, 23, 42, 0.08);
    z-index: 20;
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px 20px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    margin-bottom: 20px;
  }
  .sidebar-brand-logo {
    width: 40px; height: 40px;
    border-radius: 11px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
  }
  .sidebar-brand-text h1 {
    font-size: 16px;
    color: white;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.3px;
  }
  .sidebar-brand-text p {
    font-size: 10px;
    color: #64748b;
    margin: 1px 0 0;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .sidebar-section-label {
    font-size: 10px;
    font-weight: 800;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 14px 12px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 13px;
    border-radius: 11px;
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    font-family: inherit;
    margin-bottom: 3px;
    position: relative;
  }
  .nav-item:hover {
    background: rgba(148, 163, 184, 0.1);
    color: white;
  }
  .nav-item.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
  }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: -14px;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 22px;
    background: #667eea;
    border-radius: 0 4px 4px 0;
  }
  .nav-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.9; }
  .nav-badge {
    margin-left: auto;
    background: #ef4444;
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 50px;
    min-width: 20px;
    text-align: center;
  }
  .sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid rgba(148, 163, 184, 0.15);
  }
  .admin-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 11px;
    background: rgba(148, 163, 184, 0.08);
    margin-bottom: 6px;
  }
  .admin-avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center; justify-content: center;
    font-weight: 800;
    color: white;
    font-size: 13px;
    flex-shrink: 0;
  }
  .admin-info { min-width: 0; flex: 1; }
  .admin-info .name {
    font-size: 12px;
    color: white;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .admin-info .role { font-size: 10px; color: #64748b; }
  .btn-logout {
    width: 100%;
    padding: 10px;
    border-radius: 11px;
    background: rgba(239, 68, 68, 0.1);
    color: #fca5a5;
    font-weight: 700;
    font-size: 12px;
    border: 1px solid rgba(239, 68, 68, 0.2);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
  }
  .btn-logout:hover { background: rgba(239, 68, 68, 0.2); color: #fecaca; }

  /* MAIN */
  .main-content {
    padding: 28px 32px;
    max-width: 1400px;
    width: 100%;
    overflow-x: hidden;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-title {
    font-size: 26px;
    font-weight: 900;
    color: #0f172a;
    margin: 0;
    letter-spacing: -0.5px;
  }
  .page-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin: 3px 0 0;
  }
  .top-avatar {
    width: 38px; height: 38px;
    border-radius: 11px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    display: flex;
    align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 14px;
  }

  /* PANEL */
  .panel {
    background: white;
    border-radius: 16px;
    padding: 22px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
    animation: panelFade 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }
  @keyframes panelFade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 12px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-size: 17px;
    font-weight: 800;
    color: #0f172a;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .panel-title-icon {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, rgba(102,126,234,0.15), rgba(240,147,251,0.15));
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 15px;
  }
  .panel-count {
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
    background: #f1f5f9;
    padding: 3px 9px;
    border-radius: 50px;
  }

  /* SEARCH */
  .search-box {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 300px;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border: 1.5px solid var(--border);
    border-radius: 11px;
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
    background: #f8fafc;
    font-family: inherit;
  }
  .search-box input:focus {
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
  }
  .search-box::before {
    content: '🔍';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    opacity: 0.5;
  }

  /* TABLE */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
    min-width: 640px;
  }
  .data-table thead th {
    text-align: left;
    padding: 10px 14px;
    font-size: 10px;
    font-weight: 800;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    background: #f8fafc;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .data-table thead th:first-child { border-radius: 10px 0 0 0; }
  .data-table thead th:last-child { border-radius: 0 10px 0 0; }
  .data-table tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid #f1f5f9;
    vertical-align: middle;
  }
  .data-table tbody tr { transition: background 0.15s; }
  .data-table tbody tr:hover { background: #f8fafc; }
  .data-table tbody tr:last-child td { border-bottom: none; }

  .user-cell { display: flex; align-items: center; gap: 10px; }
  .user-avatar {
    width: 32px; height: 32px;
    border-radius: 9px;
    display: flex;
    align-items: center; justify-content: center;
    font-weight: 800;
    color: white;
    font-size: 12px;
    flex-shrink: 0;
  }
  .user-avatar.basic { background: linear-gradient(135deg, #94a3b8, #64748b); }
  .user-avatar.pro { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .user-avatar.none { background: linear-gradient(135deg, #cbd5e1, #94a3b8); }
  .user-name { font-weight: 700; color: #0f172a; font-size: 13px; }
  .user-email { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 50px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge-active { background: #d1fae5; color: #065f46; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-rejected { background: #fee2e2; color: #991b1b; }
  .badge-expired { background: #fed7aa; color: #9a3412; }
  .badge-none { background: #f1f5f9; color: #475569; }
  .badge-pro { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #78350f; }
  .badge-basic { background: linear-gradient(135deg, #e2e8f0, #cbd5e1); color: #334155; }

  .streak-cell {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 800;
    color: #ea580c;
    font-size: 13px;
  }

  /* PAYMENT CARDS */
  .payment-card {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    transition: all 0.2s;
  }
  .payment-card:hover {
    border-color: rgba(102, 126, 234, 0.4);
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.08);
  }
  .payment-card.pending { border-left: 4px solid #f59e0b; background: linear-gradient(90deg, #fffbeb 0%, white 6%); }
  .payment-card.approved { border-left: 4px solid #10b981; }
  .payment-card.rejected { border-left: 4px solid #ef4444; opacity: 0.85; }

  .payment-info { flex: 1; min-width: 200px; }
  .payment-email { font-weight: 700; color: #0f172a; font-size: 14px; margin-bottom: 3px; word-break: break-all; }
  .payment-meta {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .payment-meta .plan-tag {
    background: #f1f5f9;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 700;
    color: #334155;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .payment-meta .trx-tag {
    background: #ecfdf5;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 700;
    color: #065f46;
    font-size: 10px;
    font-family: 'Courier New', monospace;
  }
  .payment-links {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .payment-links a {
    font-size: 11px;
    font-weight: 700;
    color: #2563eb;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 7px;
    background: #eff6ff;
    transition: all 0.15s;
  }
  .payment-links a:hover { background: #dbeafe; }
  .payment-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* BUTTONS */
  .btn {
    padding: 8px 14px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 12px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn-approve { background: #059669; color: white; box-shadow: 0 2px 8px rgba(5, 150, 105, 0.25); }
  .btn-approve:hover { background: #047857; transform: translateY(-1px); }
  .btn-reject { background: #dc2626; color: white; box-shadow: 0 2px 8px rgba(220, 38, 38, 0.25); }
  .btn-reject:hover { background: #b91c1c; transform: translateY(-1px); }
  .btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 10px 20px;
    font-size: 13px;
    box-shadow: 0 4px 14px rgba(102, 126, 234, 0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5); }
  .btn-secondary { background: #f1f5f9; color: #334155; padding: 10px 20px; font-size: 13px; }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-danger { background: #fee2e2; color: #991b1b; padding: 6px 12px; font-size: 11px; }
  .btn-danger:hover { background: #fecaca; }
  .btn-filter {
    padding: 7px 13px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: white;
    color: #475569;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn-filter:hover { border-color: #94a3b8; }
  .btn-filter.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(102, 126, 234, 0.35);
  }

  /* FORMS */
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    margin-bottom: 6px;
  }
  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 11px;
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
    background: white;
    font-family: inherit;
    color: #0f172a;
  }
  .form-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
  }
  .form-input:disabled { background: #f8fafc; color: #64748b; cursor: not-allowed; }
  textarea.form-input { resize: vertical; min-height: 90px; }
  .form-hint { font-size: 11px; color: #94a3b8; margin: 6px 0 0; }

  /* MODE SWITCH */
  .mode-switch {
    display: inline-flex;
    background: #f1f5f9;
    border-radius: 11px;
    padding: 3px;
    margin-bottom: 20px;
    gap: 3px;
  }
  .mode-switch button {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #64748b;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: inherit;
  }
  .mode-switch button.active {
    background: white;
    color: #0f172a;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
  }

  /* PROGRESS */
  .progress-track {
    height: 7px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    width: 0%;
    transition: width 0.4s;
    border-radius: 4px;
  }

  /* QUESTION BLOCK */
  .q-block {
    background: #f8fafc;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    transition: all 0.2s;
  }
  .q-block:hover { border-color: #cbd5e1; background: white; }
  .opt-row { display: flex; gap: 8px; margin-bottom: 7px; align-items: center; }
  .opt-row input[type="radio"] {
    width: 16px; height: 16px;
    accent-color: #667eea;
    flex-shrink: 0;
    cursor: pointer;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 44px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state h4 { font-size: 15px; font-weight: 800; color: #334155; margin: 0 0 6px; }
  .empty-state p { font-size: 13px; margin: 0; }

  /* LIST ITEM */
  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    transition: all 0.2s;
    gap: 14px;
    flex-wrap: wrap;
    background: white;
  }
  .list-item:hover { border-color: rgba(102, 126, 234, 0.3); background: #f8fafc; }
  .list-item-info { flex: 1; min-width: 180px; }
  .list-item-title {
    font-weight: 700;
    color: #0f172a;
    font-size: 14px;
    margin-bottom: 3px;
    word-break: break-word;
  }
  .list-item-meta {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  /* CRYSTAL LOADER */
  .crystal-loader-wrap {
    background: #ffffff;
    border-radius: 20px;
    padding: 24px 36px;
    box-shadow: 0 4px 20px rgba(31, 38, 135, 0.08), 0 1px 3px rgba(31, 38, 135, 0.04);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-width: 160px;
  }
  .crystal-scene { width: 56px; height: 56px; perspective: 500px; display: flex; align-items: center; justify-content: center; }
  .crystal-cube {
    width: 40px; height: 40px;
    position: relative;
    transform-style: preserve-3d;
    animation: crystalRotate 4s linear infinite;
  }
  .crystal-face {
    position: absolute;
    width: 40px; height: 40px;
    border: 1.5px solid #667eea;
    background: rgba(102, 126, 234, 0.08);
    box-shadow: inset 0 0 12px rgba(102, 126, 234, 0.35), 0 0 12px rgba(102, 126, 234, 0.15);
  }
  .crystal-front  { transform: translateZ(20px); }
  .crystal-back   { transform: translateZ(-20px) rotateY(180deg); }
  .crystal-right  {
    transform: rotateY(90deg) translateZ(20px);
    border-color: #f093fb;
    background: rgba(240, 147, 251, 0.08);
    box-shadow: inset 0 0 12px rgba(240, 147, 251, 0.35), 0 0 12px rgba(240, 147, 251, 0.15);
  }
  .crystal-left   { transform: rotateY(-90deg) translateZ(20px); }
  .crystal-top    {
    transform: rotateX(90deg) translateZ(20px);
    border-color: #4facfe;
    background: rgba(79, 172, 254, 0.08);
    box-shadow: inset 0 0 12px rgba(79, 172, 254, 0.35), 0 0 12px rgba(79, 172, 254, 0.15);
  }
  .crystal-bottom { transform: rotateX(-90deg) translateZ(20px); }
  @keyframes crystalRotate {
    0%   { transform: rotateX(0)    rotateY(0); }
    100% { transform: rotateX(360deg) rotateY(360deg); }
  }
  .crystal-text {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: #64748b;
    text-transform: uppercase;
    display: flex;
    gap: 1px;
  }
  .crystal-text span {
    display: inline-block;
    animation: crystalBounce 1.4s ease-in-out infinite;
  }
  .crystal-text span:nth-child(1)  { animation-delay: 0s; }
  .crystal-text span:nth-child(2)  { animation-delay: 0.08s; }
  .crystal-text span:nth-child(3)  { animation-delay: 0.16s; }
  .crystal-text span:nth-child(4)  { animation-delay: 0.24s; }
  .crystal-text span:nth-child(5)  { animation-delay: 0.32s; }
  .crystal-text span:nth-child(6)  { animation-delay: 0.40s; }
  .crystal-text span:nth-child(7)  { animation-delay: 0.48s; }
  .crystal-text span:nth-child(8)  { animation-delay: 0.56s; }
  .crystal-text span:nth-child(9)  { animation-delay: 0.64s; }
  .crystal-text span:nth-child(10) { animation-delay: 0.72s; }
  .crystal-text span:nth-child(11) { animation-delay: 0.80s; }
  .crystal-text .crystal-space { width: 4px; animation: none; }
  @keyframes crystalBounce {
    0%, 60%, 100% { transform: translateY(0); color: #64748b; }
    30% { transform: translateY(-3px); color: #667eea; }
  }
  @media (max-width: 480px) {
    .crystal-loader-wrap { padding: 20px 28px; gap: 12px; }
    .crystal-scene { width: 50px; height: 50px; }
    .crystal-cube { width: 36px; height: 36px; }
    .crystal-face { width: 36px; height: 36px; }
    .crystal-front  { transform: translateZ(18px); }
    .crystal-back   { transform: translateZ(-18px) rotateY(180deg); }
    .crystal-right  { transform: rotateY(90deg) translateZ(18px); }
    .crystal-left   { transform: rotateY(-90deg) translateZ(18px); }
    .crystal-top    { transform: rotateX(90deg) translateZ(18px); }
    .crystal-bottom { transform: rotateX(-90deg) translateZ(18px); }
    .crystal-text { font-size: 11px; letter-spacing: 2px; }
  }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .admin-layout { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 260px;
      transform: translateX(-100%);
      transition: transform 0.3s;
      height: 100vh;
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-menu-btn { display: flex !important; }
    .main-content { padding: 20px 16px; }
    .page-title { font-size: 22px; }
    .panel { padding: 16px; }
  }
  .mobile-menu-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 42px; height: 42px;
    border-radius: 11px;
    background: white;
    border: 1.5px solid var(--border);
    cursor: pointer;
    font-size: 18px;
    margin-right: 10px;
  }
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    z-index: 15;
  }
  .sidebar-overlay.open { display: block; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .sidebar::-webkit-scrollbar-thumb { background: #334155; }

  /* ANALYSIS GRID */
  .analysis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .analysis-card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    border: 1px solid var(--border);
    transition: all 0.25s;
  }
  .analysis-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    border-color: rgba(102, 126, 234, 0.3);
  }
  .analysis-card .ac-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .analysis-card .ac-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .analysis-card .ac-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .analysis-card .ac-value {
    font-size: 26px;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.8px;
    line-height: 1;
    font-family: 'Space Grotesk', sans-serif;
  }
  .analysis-card .ac-sub {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 6px;
    font-weight: 600;
  }
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader" class="fixed inset-0 z-[100] items-center justify-center" style="display:none; background: rgba(15,23,42,0.5); backdrop-filter: blur(8px);">

      <span>P</span><span>l</span><span>e</span><span>a</span><span>s</span><span>e</span>

<script>
const API = "https://script.google.com/macros/s/AKfycbzM6pKA9gRPSxeuwBtxWAL2TFfuTyTqy7IdD9MeBWPuyhT6WvNJaNJEvNGNOBkzADBssA/exec";
let adminUser = null;
let newQuestions = [{ question: '', options: ['', '', '', ''], correct: 0 }];
let noteUploadMode = 'pdf';
let allUsers = [];
let allPayments = [];
let allNotes = [];
let allTests = [];
let allUpdates = [];
let allComments = [];
let currentRevenue = 0;

async function api(action, data = {}) {
  showLoader(true);
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...data })
    });
    return await r.json();
  } catch (e) { console.error('API Error:', e); return { error: 'Network error' }; }
  finally { showLoader(false); }
}

function showLoader(v) {
  const el = document.getElementById('loader');
  el.style.display = v ? 'flex' : 'none';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}

async function adminLogin() {
  const email = document.getElementById('admEmail').value.trim();
  const pass  = document.getElementById('admPass').value;
  const errEl = document.getElementById('admErr');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Please fill both fields'; return; }

  document.getElementById('loginBtn').textContent = 'Checking...';
  const res = await api('adminLogin', { email, pass });
  document.getElementById('loginBtn').textContent = 'Sign In →';

  if (res.ok) {
    adminUser = { email, loggedInAt: Date.now() };
    localStorage.setItem('studyroom_admin', JSON.stringify(adminUser));
    enterPanel();
  } else {
    errEl.textContent = res.error || 'Invalid credentials';
  }
}

function enterPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('panelScreen').style.display = 'grid';

  const initial = (adminUser.email || 'A')[0].toUpperCase();
  document.getElementById('adminAvatar').textContent = initial;
  document.getElementById('topAvatar').textContent = initial;
  document.getElementById('adminName').textContent = adminUser.email.split('@')[0];

  adminTab('analysis');
  loadAdmin();
}

function adminLogout() {
  localStorage.removeItem('studyroom_admin');
  adminUser = null;
  document.getElementById('panelScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('admEmail').value = '';
  document.getElementById('admPass').value = '';
}

const TAB_META = {
  analysis: { title: 'Analysis', subtitle: 'Overview of your platform performance' },
  subs:     { title: 'Subscribers', subtitle: 'Manage all registered users' },
  pays:     { title: 'Payments', subtitle: 'Review and approve payments' },
  notes:    { title: 'Notes', subtitle: 'Upload and manage study materials' },
  tests:    { title: 'Mock Tests', subtitle: 'Create Pro-only timed tests' },
  updates:  { title: 'Updates', subtitle: 'Broadcast messages to all users' },
  comments: { title: 'Comments', subtitle: 'Moderate discussion forum' }
};

function adminTab(name) {
  document.querySelectorAll('.admin-content').forEach(c => c.style.display = 'none');
  document.getElementById('admin-' + name).style.display = 'block';

  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('tabBtn-' + name).classList.add('active');

  const meta = TAB_META[name] || {};
  document.getElementById('pageTitle').textContent = meta.title || '';
  document.getElementById('pageSubtitle').textContent = meta.subtitle || '';

  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

async function loadAdmin() {
  const res = await api('adminData');
  if (res.error) return alert(res.error);

  allUsers = res.users || [];
  allPayments = res.payments || [];
  allNotes = res.notes || [];
  allTests = res.tests || [];
  allUpdates = res.updates || [];
  allComments = res.comments || [];
  currentRevenue = res.revenue || 0;

  const pendingCount = allPayments.filter(p => p.status === 'Pending').length;
  const badge = document.getElementById('pendingBadge');
  if (pendingCount > 0) {
    badge.textContent = pendingCount;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }

  renderAnalysis();
  renderSubscribers();
  renderPayments();
  renderNotes();
  renderTests();
  renderUpdates();
  renderComments();
}

function renderAnalysis() {
  const activeCount = allUsers.filter(u => u.status === 'active').length;
  const expiredCount = allUsers.filter(u => u.status === 'expired').length;
  const pendingCount = allPayments.filter(p => p.status === 'Pending').length;
  const approvedCount = allPayments.filter(p => p.status === 'Approved').length;
  const rejectedCount = allPayments.filter(p => p.status === 'Rejected').length;
  const approvalRate = (approvedCount + rejectedCount) > 0
    ? Math.round((approvedCount / (approvedCount + rejectedCount)) * 100) : 0;

  document.getElementById('analysisContent').innerHTML = `
    <div class="analysis-grid">
      <div class="analysis-card">
        <div class="ac-header">
          <div class="ac-icon" style="background: linear-gradient(135deg, #d1fae5, #a7f3d0);">💰</div>
          <div class="ac-label">Total Revenue</div>
        </div>
        <div class="ac-value">${currentRevenue.toLocaleString()}<small style="font-size:14px;font-weight:700;color:#94a3b8;margin-left:4px;">৳</small></div>
      </div>

      <div class="analysis-card">
        <div class="ac-header">
          <div class="ac-icon" style="background: linear-gradient(135deg, #dbeafe, #bfdbfe);">👥</div>
          <div class="ac-label">Active Subscribers</div>
        </div>
        <div class="ac-value">${activeCount}</div>
      </div>

      <div class="analysis-card">
        <div class="ac-header">
          <div class="ac-icon" style="background: linear-gradient(135deg, #fef3c7, #fde68a);">⏳</div>
          <div class="ac-label">Pending Payments</div>
        </div>
        <div class="ac-value">${pendingCount}</div>
      </div>

      <div class="analysis-card">
        <div class="ac-header">
          <div class="ac-icon" style="background: linear-gradient(135deg, #ede9fe, #ddd6fe);">📈</div>
          <div class="ac-label">Approval Rate</div>
        </div>
        <div class="ac-value">${approvalRate}<small style="font-size:14px;font-weight:700;color:#94a3b8;margin-left:2px;">%</small></div>
        <div class="ac-sub">${approvedCount} approved · ${rejectedCount} rejected</div>
      </div>
    </div>

    <div class="analysis-grid">
      <div class="analysis-card">
        <div class="ac-header">
          <div class="ac-icon" style="background: linear-gradient(135deg, #fed7aa, #fdba74);">⌛</div>
          <div class="ac-label">Expired</div>
        </div>
        <div class="ac-value">${expiredCount}</div>
      </div>

      <div class="analysis-card">
        <div class="ac-header">
          <div class="ac-icon" style="background: linear-gradient(135deg, #cffafe, #a5f3fc);">📄</div>
          <div class="ac-label">Content</div>
        </div>
        <div class="ac-value">${allNotes.length + allTests.length}</div>
      </div>
    </div>

    <div class="panel" style="margin-top:4px;">
      <div class="panel-header">
        <h2 class="panel-title">
          <span class="panel-title-icon">⚡</span>
          Quick Actions
        </h2>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
        <button onclick="adminTab('pays')" class="btn btn-primary" style="justify-content:center; padding:14px;">💳 Review Payments</button>
        <button onclick="adminTab('notes')" class="btn btn-primary" style="justify-content:center; padding:14px;">📄 Upload Notes</button>
        <button onclick="adminTab('tests')" class="btn btn-primary" style="justify-content:center; padding:14px;">🧪 Create Test</button>
        <button onclick="adminTab('updates')" class="btn btn-primary" style="justify-content:center; padding:14px;">📢 Post Update</button>
      </div>
    </div>
  `;
}

function renderSubscribers() {
  const latestPay = {};
  allPayments.forEach(p => {
    const e = (p.email || '').toLowerCase();
    if (!latestPay[e]) latestPay[e] = p;
  });

  document.getElementById('admin-subs').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">
          <span class="panel-title-icon">👥</span>
          All Subscribers
          <span class="panel-count">${allUsers.length}</span>
        </h2>
        <div class="search-box">
          <input type="text" id="subsSearch" placeholder="Search by name or email..." oninput="filterSubs(this.value)" />
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>User</th>
              <th style="text-align: center;">Plan</th>
              <th style="text-align: center;">Status</th>
              <th style="text-align: center;">Expires</th>
              <th style="text-align: center;">Streak</th>
              <th style="text-align: center;">Joined</th>
            </tr>
          </thead>
          <tbody id="subsBody">
            ${renderSubsRows(allUsers, latestPay)}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderSubsRows(users, latestPay) {
  if (!users.length) {
    return `<tr><td colspan="6"><div class="empty-state"><div class="icon">👥</div><h4>No subscribers yet</h4><p>Users will appear here after they sign up</p></div></td></tr>`;
  }

  return users.map(u => {
    const k = (u.email || '').toLowerCase();
    const pay = latestPay[k];
    let displayPlan = u.plan || (pay ? pay.plan : '') || '—';
    let status = 'none';
    if (u.status === 'active') status = 'active';
    else if (u.status === 'expired') status = 'expired';
    else if (pay) status = (pay.status || '').toLowerCase();
    else status = u.status || 'none';

    let statusBadge = '';
    if (status === 'active' || status === 'approved') statusBadge = `<span class="badge badge-active">● Active</span>`;
    else if (status === 'pending') statusBadge = `<span class="badge badge-pending">● Pending</span>`;
    else if (status === 'rejected') statusBadge = `<span class="badge badge-rejected">● Rejected</span>`;
    else if (status === 'expired') statusBadge = `<span class="badge badge-expired">● Expired</span>`;
    else statusBadge = `<span class="badge badge-none">● None</span>`;

    let planBadge = '';
    if (displayPlan === 'Pro') planBadge = `<span class="badge badge-pro">⭐ Pro</span>`;
    else if (displayPlan === 'Basic') planBadge = `<span class="badge badge-basic">🥈 Basic</span>`;
    else planBadge = `<span style="color: #94a3b8;">—</span>`;

    const avatarClass = displayPlan === 'Pro' ? 'pro' : displayPlan === 'Basic' ? 'basic' : 'none';
    const initial = (u.name || u.email || '?')[0].toUpperCase();

    return `
      <tr data-search="${(u.name + ' ' + u.email).toLowerCase()}">

function renderPaymentsList(payments) {
  if (!payments.length) {
    return `<div class="empty-state"><div class="icon">💳</div><h4>No payments</h4><p>Payment submissions will appear here</p></div>`;
  }

  return payments.map(p => {
    const statusClass = p.status === 'Approved' ? 'approved' : p.status === 'Rejected' ? 'rejected' : 'pending';
    let statusBadge = '';
    if (p.status === 'Approved') statusBadge = `<span class="badge badge-active">✓ Approved</span>`;
    else if (p.status === 'Rejected') statusBadge = `<span class="badge badge-rejected">✕ Rejected</span>`;
    else statusBadge = `<span class="badge badge-pending">⏳ Pending</span>`;

    const date = p.date ? new Date(p.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';

    return `
      <div class="payment-card ${statusClass}">
        <div class="payment-info">
          <div class="payment-email">${p.email}</div>
          <div class="payment-meta">
            <span class="plan-tag">${p.plan}</span>
            <span style="font-weight: 800; color: #059669;">${p.amount}৳</span>
            ${p.trxId ? `<span class="trx-tag">${p.trxId}</span>` : ''}
            <span>·</span>
            <span>${date}</span>
          </div>
          ${(p.screenshot || p.invoiceUrl) ? `
            <div class="payment-links">
              ${p.screenshot ? `<a href="${p.screenshot}" target="_blank">📷 View Screenshot</a>` : ''}
              ${p.invoiceUrl ? `<a href="${p.invoiceUrl}" target="_blank">📄 Invoice</a>` : ''}
            </div>
          ` : ''}
        </div>
        <div class="payment-actions">
          ${statusBadge}
          ${p.status === 'Pending' ? `
            <button onclick="approvePay('${p.id}')" class="btn btn-approve">✓ Approve</button>
            <button onclick="rejectPay('${p.id}')" class="btn btn-reject">✕ Reject</button>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function filterPayments(filter) {
  ['all','pending','approved','rejected'].forEach(f => {
    const btn = document.getElementById('payFilter-' + f);
    if (btn) btn.classList.toggle('active', f === filter);
  });

  let filtered = allPayments;
  if (filter === 'pending') filtered = allPayments.filter(p => p.status === 'Pending');
  else if (filter === 'approved') filtered = allPayments.filter(p => p.status === 'Approved');
  else if (filter === 'rejected') filtered = allPayments.filter(p => p.status === 'Rejected');

  document.getElementById('paymentsList').innerHTML = renderPaymentsList(filtered);
}

function switchNoteMode(mode) {

  const pdfBtn = document.getElementById('noteModePdf');
  const linkBtn = document.getElementById('noteModeLink');
  const pdfPanel = document.getElementById('pdfPanel');
  const linkPanel = document.getElementById('linkPanel');
  if (mode === 'pdf') {
    pdfBtn.classList.add('active'); linkBtn.classList.remove('active');
    pdfPanel.style.display = 'block'; linkPanel.style.display = 'none';
  } else {
    linkBtn.classList.add('active'); pdfBtn.classList.remove('active');
    linkPanel.style.display = 'block'; pdfPanel.style.display = 'none';
  }
}

function onPdfPick(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) {
    alert('PDF too large (max 20 MB)');
    input.value = '';
  }
}

async function saveNote() {
  const title = document.getElementById('noteTitle').value.trim();
  if (!title) return alert('Please enter a note title');

  if (noteUploadMode === 'link') {
    const link = document.getElementById('noteLink').value.trim();
    if (!link) return alert('Please paste a Google Drive link');
    if (link.indexOf('drive.google.com') === -1 && link.indexOf('docs.google.com') === -1) {
      return alert('Please paste a valid Google Drive link');
    }
    const res = await api('addNoteFromLink', { title, link });
    if (res.success) { alert('✅ Note saved!'); loadAdmin(); }
    else alert('❌ ' + res.error);
    return;
  }

  const file = document.getElementById('notePdf').files[0];
  if (!file) return alert('Please choose a PDF file');

  const progressWrap = document.getElementById('uploadProgress');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  progressWrap.style.display = 'block';
  progressFill.style.width = '0%';
  progressText.textContent = 'Reading file...';

  const reader = new FileReader();
  reader.onprogress = (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 40);
      progressFill.style.width = pct + '%';
      progressText.textContent = `Reading... ${Math.round(pct * 2.5)}%`;
    }
  };
  reader.onload = async (e) => {
    progressFill.style.width = '50%';
    progressText.textContent = 'Uploading to Google Drive...';
    try {
      const res = await api('addNote', { title, pdf: e.target.result });
      if (res.success) {
        progressFill.style.width = '100%';
        progressText.textContent = 'Complete!';
        setTimeout(() => { alert('✅ Note uploaded!'); loadAdmin(); }, 400);
      } else {
        progressWrap.style.display = 'none';
        alert('❌ ' + (res.error || 'Upload failed'));
      }
    } catch (err) {
      progressWrap.style.display = 'none';
      alert('❌ Network error. Try Drive link option instead.');
    }
  };
  reader.onerror = () => {
    progressWrap.style.display = 'none';
    alert('❌ Failed to read file');
  };
  reader.readAsDataURL(file);
}

  newQuestions.push({ question: '', options: ['', '', '', ''], correct: 0 });

}
function removeQuestion(i) {
  newQuestions.splice(i, 1);

}

async function approvePay(id) { await api('approvePayment', { id }); loadAdmin(); }
async function rejectPay(id)  { await api('rejectPayment', { id }); loadAdmin(); }

  const title = document.getElementById('updTitle').value.trim();

  await api('postUpdate', { title, message });

async function removeNote(tier, title) {
  if (!confirm('Remove this note?')) return;
  await api('removeNote', { tier, title });
  loadAdmin();
}

async function submitTest() {
  const title = document.getElementById('testTitle').value.trim();
  const duration = Number(document.getElementById('testDuration').value) || 10;
  if (!title) return alert('Test title required');
  const questions = newQuestions.map(q => ({
    question: q.question.trim(),
    options: q.options.map(o => o.trim()),
    correct: q.correct
  })).filter(q => q.question && q.options.filter(o=>o).length >= 2);
  if (!questions.length) return alert('At least one valid question required');
  const res = await api('addTest', { title, duration, questions, tier: 'Pro' });
  if (res.success) {
    alert('✅ Test saved! (Pro users only)');
    newQuestions = [{ question: '', options: ['', '', '', ''], correct: 0 }];
    loadAdmin();
  } else alert('❌ ' + res.error);
}

async function removeTest(testId) {
  if (!confirm('Remove this test?')) return;
  await api('removeTest', { testId });
  loadAdmin();
}

async function removeComment(email, noteTitle, message) {
  if (!confirm('Delete this comment?')) return;
  await api('removeComment', { email, noteTitle, message });
  loadAdmin();
}
